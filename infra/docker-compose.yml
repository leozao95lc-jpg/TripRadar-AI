services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripradar
      POSTGRES_PASSWORD: tripradar
      POSTGRES_DB: tripradar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP (dev) — inbox web em 8025
      - "8025:8025"

  api:
    build:
      context: ../apps/api
    env_file:
      - ../apps/api/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://tripradar:tripradar@postgres:5432/tripradar
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailhog
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
