[project]
name = "tripradar-api"
version = "0.1.0"
description = "TripRadar AI backend — monolito modular (Clean Architecture / DDD)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.13,<1.14",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-jose[cryptography]>=3.3,<3.4",
    "passlib[bcrypt]>=1.7,<1.8",
    "bcrypt<4.1",
    "httpx>=0.27,<0.28",
    "redis>=5.0,<6.0",
    "structlog>=24.4,<25.0",
    "authlib>=1.3,<1.4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.7",
    "freezegun>=1.5,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) como default de argumento é o padrão idiomático do FastAPI
