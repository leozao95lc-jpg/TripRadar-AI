<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Política de segurança: a página não carrega nada de fora nem faz
     requisições de rede. É isso que sustenta a frase "seus dados não
     saem deste navegador" exibida ao usuário. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Espanha Organizada — planejador de mudança para estudar na Espanha</title>
<meta name="description" content="Painel pessoal para organizar a mudança à Espanha por estudos: tarefas, documentos, orçamento, cronograma e primeiros dias.">
<meta name="theme-color" content="#1d5c58">
<meta name="apple-mobile-web-app-title" content="Espanha Organizada">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d5c58'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  color-scheme:light;
  --bg:#f6f5f1;
  --surface:#ffffff;
  --surface-2:#fafaf7;
  --ink:#1c2422;
  --ink-2:#47524f;
  --ink-3:#66716e;
  --line:#e3e1d9;
  --line-2:#cdcabf;
  --pri:#1d5c58;
  --pri-2:#154542;
  --pri-soft:#e4efed;
  --warn:#835500;
  --warn-soft:#fbf0d9;
  --bad:#9e2e26;
  --bad-soft:#f9e4e1;
  --ok:#2a6842;
  --ok-soft:#e3f1e7;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(28,36,34,.05), 0 4px 14px -8px rgba(28,36,34,.18);
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* =========================================================
   BASE
   ========================================================= */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ margin:0; line-height:1.25; letter-spacing:-.01em; }
h1{ font-size:1.6rem; font-weight:700; }
h2{ font-size:1.15rem; font-weight:700; }
h3{ font-size:1rem; font-weight:650; }
p{ margin:0; }
a{ color:var(--pri); }
button, input, select, textarea{ font:inherit; color:inherit; }
.num{ font-variant-numeric:tabular-nums; }
.muted{ color:var(--ink-3); }
.small{ font-size:.84rem; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible{ outline:2px solid var(--pri); outline-offset:2px; }
.ic{ width:20px; height:20px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.ic-sm{ width:16px; height:16px; }

/* =========================================================
   LAYOUT
   ========================================================= */
.app{ min-height:100vh; }
.sidebar{ display:none; }
.mobile-top{
  position:sticky; top:0; z-index:30; background:rgba(246,245,241,.95); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand{ display:flex; align-items:center; gap:9px; font-weight:750; letter-spacing:-.01em; color:var(--ink); text-decoration:none; }
.brand-mark{ width:28px; height:28px; border-radius:8px; background:var(--pri); color:#fff; display:grid; place-items:center; }
.brand-mark .ic{ width:17px; height:17px; stroke-width:2.6; }
.save-state{ font-size:.75rem; color:var(--ink-3); white-space:nowrap; }
.save-state.is-error{ color:var(--bad); font-weight:700; }
.main{ padding:20px 16px 110px; max-width:1040px; margin:0 auto; }

.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(6,1fr); padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav a, .bottom-nav button{
  display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px 7px; font-size:.68rem; font-weight:650;
  color:var(--ink-3); text-decoration:none; background:none; border:0; cursor:pointer; min-height:56px; justify-content:center;
}
.bottom-nav [aria-current="page"]{ color:var(--pri); }

@media (min-width:960px){
  .app{ display:grid; grid-template-columns:240px 1fr; }
  .mobile-top, .bottom-nav{ display:none; }
  .sidebar{
    display:flex; flex-direction:column; gap:20px; position:sticky; top:0; height:100vh; padding:22px 14px;
    border-right:1px solid var(--line); background:var(--surface-2);
  }
  .sidebar nav{ display:flex; flex-direction:column; gap:2px; }
  .sidebar nav a{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm); text-decoration:none;
    color:var(--ink-2); font-weight:600; font-size:.92rem;
  }
  .sidebar nav a:hover{ background:var(--pri-soft); color:var(--pri-2); }
  .sidebar nav a[aria-current="page"]{ background:var(--pri); color:#fff; }
  .sidebar-foot{ margin-top:auto; font-size:.75rem; color:var(--ink-3); display:flex; flex-direction:column; gap:6px; padding:0 8px; }
  .main{ padding:32px 36px 60px; }
}

/* =========================================================
   COMPONENTES
   ========================================================= */
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; margin-bottom:18px; }
.page-head p{ color:var(--ink-2); margin-top:4px; max-width:65ch; }
.section{ margin-top:28px; }
.section > h2{ margin-bottom:12px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
.grid{ display:grid; gap:12px; }
.grid-kpi{ grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); }
.grid-2{ grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); }
.kpi-label{ font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--ink-3); }
.kpi-value{ font-size:1.45rem; font-weight:750; margin-top:4px; font-variant-numeric:tabular-nums; }
.kpi-note{ font-size:.82rem; color:var(--ink-2); margin-top:2px; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line-2);
  background:var(--surface); color:var(--ink); border-radius:999px; padding:9px 16px; font-weight:650; font-size:.88rem;
  cursor:pointer; min-height:40px; text-decoration:none; white-space:nowrap;
}
.btn:hover{ border-color:var(--ink-3); }
.btn-primary{ background:var(--pri); border-color:var(--pri); color:#fff; }
.btn-primary:hover{ background:var(--pri-2); border-color:var(--pri-2); }
.btn-danger{ background:var(--bad); border-color:var(--bad); color:#fff; }
.btn-danger-ghost{ color:var(--bad); border-color:color-mix(in srgb, var(--bad) 35%, white); }
.btn-danger-ghost:hover{ background:var(--bad-soft); border-color:var(--bad); }
.btn-sm{ padding:6px 12px; min-height:34px; font-size:.82rem; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
.icon-btn{
  display:inline-grid; place-items:center; width:36px; height:36px; border-radius:var(--radius-sm); border:0; background:transparent;
  color:var(--ink-3); cursor:pointer;
}
.icon-btn:hover{ background:var(--pri-soft); color:var(--pri-2); }
.icon-btn[disabled]{ opacity:.3; cursor:default; background:none; }

.pill{ display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:2px 9px; font-size:.74rem; font-weight:700; white-space:nowrap; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); }
.pill-pri{ background:var(--pri-soft); color:var(--pri-2); border-color:transparent; }
.pill-ok{ background:var(--ok-soft); color:var(--ok); border-color:transparent; }
.pill-warn{ background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.pill-bad{ background:var(--bad-soft); color:var(--bad); border-color:transparent; }

.callout{ border-radius:var(--radius-sm); padding:12px 14px; font-size:.88rem; border:1px solid; display:flex; gap:10px; align-items:flex-start; }
.callout .ic{ margin-top:1px; }
.callout-info{ background:var(--pri-soft); border-color:color-mix(in srgb, var(--pri) 25%, white); color:var(--pri-2); }
.callout-warn{ background:var(--warn-soft); border-color:color-mix(in srgb, var(--warn) 30%, white); color:#5e3e00; }
.callout-bad{ background:var(--bad-soft); border-color:color-mix(in srgb, var(--bad) 30%, white); color:#6f1f19; }
.callout + .callout{ margin-top:10px; }

.progress{ height:8px; background:#ebe9e1; border-radius:999px; overflow:hidden; }
.progress > span{ display:block; height:100%; background:var(--pri); border-radius:999px; transition:width .2s; }
.progress-lg{ height:12px; }

.empty{ text-align:center; padding:28px 16px; color:var(--ink-2); border:1px dashed var(--line-2); border-radius:var(--radius); background:var(--surface-2); }
.empty strong{ display:block; color:var(--ink); margin-bottom:4px; }
.empty .btn{ margin-top:12px; }

/* Filtros */
.toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
.toolbar select, .field input, .field select, .field textarea, .inline-input{
  border:1px solid var(--line-2); border-radius:var(--radius-sm); background:var(--surface); padding:8px 10px; min-height:40px; font-size:.9rem;
}
.toolbar select{ max-width:100%; }
.toolbar .spacer{ flex:1; }

/* Lista de tarefas */
.stage{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
.stage > summary{
  list-style:none; cursor:pointer; padding:14px 16px; display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:center;
}
.stage > summary::-webkit-details-marker{ display:none; }
.stage-num{ width:28px; height:28px; border-radius:50%; background:var(--pri-soft); color:var(--pri-2); display:grid; place-items:center; font-weight:750; font-size:.85rem; }
.stage-done .stage-num{ background:var(--pri); color:#fff; }
.stage-meta{ font-size:.8rem; color:var(--ink-3); white-space:nowrap; }
.stage .progress{ grid-column:2 / 4; height:5px; }
.stage-current{ border-color:var(--pri); }
.task-list{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.task{ display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px; padding:12px 12px 12px 16px; border-bottom:1px solid var(--line); align-items:start; }
.task:last-child{ border-bottom:0; }
.task-check{ width:22px; height:22px; margin:2px 0 0; accent-color:var(--pri); cursor:pointer; }
.task-title{ font-weight:650; background:none; border:0; padding:0; text-align:left; cursor:pointer; color:var(--ink); }
.task-title:hover{ color:var(--pri); text-decoration:underline; }
.task.is-done .task-title{ color:var(--ink-3); text-decoration:line-through; }
.task-desc{ font-size:.85rem; color:var(--ink-2); margin-top:2px; }
.task-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center; }
.task-actions{ display:flex; gap:0; align-items:center; }
.stage-foot{ padding:10px 16px; border-top:1px solid var(--line); background:var(--surface-2); }

/* Documentos */
.doc-list{ display:grid; gap:10px; }
.doc{ display:grid; grid-template-columns:1fr auto; gap:6px 12px; }
.doc-head{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; }
.doc-name{ font-weight:700; background:none; border:0; padding:0; cursor:pointer; text-align:left; }
.doc-name:hover{ color:var(--pri); text-decoration:underline; }
.doc-facts{ display:flex; flex-wrap:wrap; gap:4px 16px; font-size:.84rem; color:var(--ink-2); margin-top:4px; }
.doc-facts b{ color:var(--ink); font-weight:650; }

/* Tabelas */
.table-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
td{ padding:8px 12px; border-bottom:1px solid var(--line); font-size:.9rem; vertical-align:middle; }
tbody tr:last-child td{ border-bottom:0; }
tfoot td{ border-top:2px solid var(--line-2); border-bottom:0; font-weight:750; }
td.r, th.r{ text-align:right; }
.pos{ color:var(--ok); }
.neg{ color:var(--bad); }
.inline-input{ width:110px; text-align:right; font-variant-numeric:tabular-nums; min-height:36px; padding:6px 8px; }
.inline-input.is-invalid{ border-color:var(--bad); background:var(--bad-soft); }
.bud-table{ min-width:720px; }
.bars{ display:grid; gap:10px; }
.bar-row{ display:grid; grid-template-columns:minmax(110px,180px) 1fr auto; gap:10px; align-items:center; font-size:.85rem; }
.bar-track{ position:relative; height:14px; background:#ebe9e1; border-radius:4px; overflow:hidden; }
.bar-track .plan{ position:absolute; inset:0 auto 0 0; background:color-mix(in srgb, var(--pri) 30%, white); }
.bar-track .act{ position:absolute; left:0; top:4px; bottom:4px; background:var(--pri-2); border-radius:2px; }
.legend{ display:flex; gap:16px; font-size:.78rem; color:var(--ink-2); margin-bottom:10px; flex-wrap:wrap; }
.legend i{ display:inline-block; width:12px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }

/* Configuração financeira */
.fin-settings{ display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-end; }
.fin-settings label{ display:flex; flex-direction:column; gap:4px; font-size:.8rem; font-weight:650; color:var(--ink-2); }
.seg{ display:inline-flex; border:1px solid var(--line-2); border-radius:999px; overflow:hidden; }
.seg button{ border:0; background:var(--surface); padding:8px 16px; font-weight:700; font-size:.85rem; cursor:pointer; min-height:40px; }
.seg button[aria-pressed="true"]{ background:var(--pri); color:#fff; }

/* Linha do tempo */
.timeline{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.tl-item{ display:grid; grid-template-columns:74px 1fr auto; gap:12px; align-items:start; }
.tl-date{ text-align:center; border-radius:var(--radius-sm); background:var(--surface-2); border:1px solid var(--line); padding:6px 4px; }
.tl-date strong{ display:block; font-size:1.05rem; font-variant-numeric:tabular-nums; }
.tl-date span{ font-size:.72rem; color:var(--ink-3); text-transform:capitalize; }
.tl-item.is-overdue .tl-date{ background:var(--bad-soft); border-color:transparent; color:var(--bad); }
.tl-item.is-soon .tl-date{ background:var(--warn-soft); border-color:transparent; }
.tl-item.is-arrival .tl-date{ background:var(--pri); color:#fff; border-color:transparent; }
.tl-item.is-arrival .tl-date span{ color:#d9ecea; }
.tl-title{ font-weight:650; }
.tl-sub{ font-size:.84rem; color:var(--ink-2); margin-top:2px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }

/* Início */
.hello{ display:flex; flex-direction:column; gap:4px; }
.hello-sub{ color:var(--ink-2); display:flex; flex-wrap:wrap; gap:4px 14px; }
.big-progress{ display:flex; align-items:baseline; gap:10px; margin:6px 0 10px; }
.big-progress strong{ font-size:2.2rem; font-weight:800; font-variant-numeric:tabular-nums; }
.stat-row{ display:flex; flex-wrap:wrap; gap:6px 18px; font-size:.86rem; color:var(--ink-2); margin-top:10px; }
.stat-row b{ color:var(--ink); font-variant-numeric:tabular-nums; }
.mini-list{ list-style:none; margin:0; padding:0; }
.mini-list li{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
.mini-list li:last-child{ border-bottom:0; }
.mini-list .grow{ flex:1; min-width:0; }
.shortcuts{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; }
.shortcut{
  display:flex; align-items:center; gap:10px; padding:14px; border-radius:var(--radius); background:var(--surface);
  border:1px solid var(--line); text-decoration:none; color:var(--ink); font-weight:650; font-size:.9rem;
}
.shortcut:hover{ border-color:var(--pri); color:var(--pri-2); }
.shortcut .ic{ color:var(--pri); }

/* Fontes */
.src{ display:grid; gap:4px; }
.src-org{ font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); font-weight:700; }
.src a{ font-weight:700; word-break:break-word; }
.src-check{ font-size:.78rem; color:var(--ink-3); }

/* Onboarding */
.ob{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
.ob-card{ width:100%; max-width:560px; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:28px 24px; }
.ob-steps{ display:flex; gap:5px; margin-bottom:22px; }
.ob-steps span{ flex:1; height:4px; border-radius:2px; background:var(--line); }
.ob-steps span.on{ background:var(--pri); }
.ob h1{ font-size:1.5rem; margin-bottom:8px; }
.ob-lead{ color:var(--ink-2); margin-bottom:18px; }
.ob-foot{ display:flex; justify-content:space-between; gap:10px; margin-top:24px; flex-wrap:wrap; }
.ob-foot .btn-row{ margin-left:auto; }
.choices{ display:grid; gap:8px; }
.choice{ display:flex; align-items:center; gap:10px; border:1px solid var(--line-2); border-radius:var(--radius-sm); padding:12px 14px; cursor:pointer; }
.choice:has(input:checked){ border-color:var(--pri); background:var(--pri-soft); }
.choice input{ accent-color:var(--pri); width:18px; height:18px; }
.ob-welcome-list{ margin:0 0 20px; padding-left:1.1em; color:var(--ink-2); }
.ob-welcome-list li{ margin:4px 0; }

/* Formulários */
.form{ display:grid; gap:14px; }
.form-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; }
.field{ display:flex; flex-direction:column; gap:5px; font-size:.84rem; font-weight:650; color:var(--ink-2); }
.field input, .field select, .field textarea{ width:100%; color:var(--ink); font-weight:400; }
.field textarea{ min-height:84px; resize:vertical; }
.field .hint{ font-weight:400; font-size:.78rem; color:var(--ink-3); }
.field.is-invalid input, .field.is-invalid select{ border-color:var(--bad); }
.field-check{ flex-direction:row; align-items:center; gap:8px; }
.form-error{ color:var(--bad); font-weight:650; font-size:.88rem; }

/* Diálogo */
dialog{
  border:0; padding:0; border-radius:16px; width:min(600px, calc(100vw - 24px)); max-height:calc(100vh - 32px);
  box-shadow:0 20px 60px -20px rgba(0,0,0,.4); color:var(--ink); background:var(--surface);
}
dialog::backdrop{ background:rgba(20,28,26,.45); }
.dlg{ display:flex; flex-direction:column; max-height:calc(100vh - 32px); }
.dlg-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line); }
.dlg-body{ padding:18px; overflow-y:auto; }
.dlg-body p + p{ margin-top:10px; }
.dlg-foot{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; padding:14px 18px; border-top:1px solid var(--line); background:var(--surface-2); }
.dlg-foot .left{ margin-right:auto; }
.more-list{ display:grid; gap:6px; }
.more-list a{ display:flex; gap:10px; align-items:center; padding:12px; border-radius:var(--radius-sm); text-decoration:none; color:var(--ink); font-weight:650; border:1px solid var(--line); }

/* Toasts */
.toasts{ position:fixed; left:50%; transform:translateX(-50%); bottom:84px; z-index:100; display:grid; gap:8px; width:min(420px, calc(100vw - 32px)); }
.toast{ background:var(--ink); color:#fff; border-radius:var(--radius-sm); padding:11px 14px; font-size:.88rem; box-shadow:var(--shadow); }
.toast.is-error{ background:var(--bad); }
@media (min-width:960px){ .toasts{ bottom:24px; } }

.banner{ margin-bottom:16px; }
.footer-legal{ margin-top:40px; padding-top:16px; border-top:1px solid var(--line); font-size:.78rem; color:var(--ink-3); }

@media (max-width:520px){
  h1{ font-size:1.35rem; }
  .tl-item{ grid-template-columns:62px 1fr auto; gap:10px; }
  .bar-row{ grid-template-columns:1fr auto; }
  .bar-row .bar-track{ grid-column:1 / 3; grid-row:2; }
  .task{ padding-left:12px; }
  .ob-card{ padding:22px 18px; }
  .toolbar select{ flex:1 1 calc(50% - 4px); min-width:0; }
  .page-head > .btn, .page-head > .btn-row{ width:100%; }
  .page-head > .btn-row .btn{ flex:1; }
}

/* =========================================================
   IMPRESSÃO — imprime apenas o resumo gerado
   ========================================================= */
#print-root{ display:none; }
@media print{
  body{ background:#fff; font-size:11pt; }
  body > *:not(#print-root){ display:none !important; }
  #print-root{ display:block; color:#000; }

  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){

  function safeUrl(url){

  function isoOf(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO(){ return isoOf(new Date()); }
  function addDays(n){ var d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); }

  function validISO(s){
    if(typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = s.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    return p[0] >= 1900 && p[0] <= 2100 && d.getFullYear() === p[0] && d.getMonth() === p[1] - 1 && d.getDate() === p[2];
  }

  function daysFromToday(s){
    if(!validISO(s)) return null;
    var p = s.split('-').map(Number);
    var t = new Date();
    return Math.round((Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
  }

  function fmtDate(s){
    if(!validISO(s)) return '—';
    var p = s.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function weekday(s){
    if(!validISO(s)) return '';
    var p = s.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('pt-BR', { weekday:'short' }).replace('.', '');
  }
  function relDays(n){
    if(n === null) return '';
    if(n === 0) return 'hoje';
    if(n === 1) return 'amanhã';
    if(n === -1) return 'ontem';
    return n > 0 ? 'em ' + n + ' dias' : 'há ' + (-n) + ' dias';
  }

  /* Aceita "1.234,56", "1234,56", "1234.56" e "1.500" (milhar). Retorna
     null para vazio e NaN para texto inválido. */
  function parseNum(v){
    if(typeof v === 'number') return isFinite(v) ? v : NaN;
    var s = String(v == null ? '' : v).trim().replace(/\s|€|R\$/g, '');
    if(s === '') return null;
    var neg = s.charAt(0) === '-';
    if(neg) s = s.slice(1);
    if(s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    if(!/^(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
    var n = parseFloat(s);
    return neg ? -n : n;
  }
  function round2(n){ return Math.round(n * 100) / 100; }
  function fmtMoney(v, cur){
    if(v === null || v === undefined || isNaN(v)) return '—';
    return Number(v).toLocaleString('pt-BR', { style:'currency', currency:cur || 'EUR' });
  }
  function fmtPlain(v){
    if(v === null || v === undefined || isNaN(v)) return '';
    return Number(v).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
  }

  function str(v, max){ return typeof v === 'string' ? v.slice(0, max || 500) : ''; }
  function oneOf(v, map, fallback){ return Object.prototype.hasOwnProperty.call(map, v) ? v : fallback; }
  function numOrNull(v){ return (typeof v === 'number' && isFinite(v)) ? v : null; }
  function isoOrEmpty(v){ return validISO(v) ? v : ''; }

      tasks:[], docs:[], docCategories:DEFAULT_DOC_CATS.slice(),
      budget:{ display:'EUR', rate:null, rateDate:'', reserve:null, reserveCurrency:'EUR', items:[] },
      events:[], sources:[]
    };
  }

  function buildTasks(){
    var orderByStage = {};
    return TASK_TEMPLATE.map(function(r){
      orderByStage[r[0]] = (orderByStage[r[0]] || 0) + 1;
      return { id:uid(), stage:r[0], category:r[1], priority:r[2], title:r[3], desc:r[4], src:r[5] || '', link:r[5] && SOURCE_BY_ID[r[5]] ? SOURCE_BY_ID[r[5]].url : '',
               status:'pendente', due:'', notes:'', order:orderByStage[r[0]] };
    });
  }

  function docFromTemplate(t){
    return { id:uid(), tpl:t.tpl, name:t.name, category:t.cat, person:t.person, status:'nao-iniciado', issued:'', expires:'',
             apostila:t.apost || '', traducao:t.trad || '', notes:t.notes || '', src:t.src || '',
             link:t.src && SOURCE_BY_ID[t.src] ? SOURCE_BY_ID[t.src].url : '' };
  }
  function buildDocs(profile){
    return DOC_TEMPLATE.filter(function(t){ return !t.when || t.when(profile); }).map(docFromTemplate);
  }
  function buildBudget(){
    return BUDGET_TEMPLATE.map(function(c){ return { id:uid(), category:c, desc:'', currency:'EUR', planned:null, actual:null }; });
  }
  function applyTemplate(st){
    st.tasks = buildTasks();
    st.docs = buildDocs(st.profile);
    st.docCategories = DEFAULT_DOC_CATS.slice();
    st.budget.items = buildBudget();
    st.events = [];
  }

  /* Valida e saneia um estado vindo do localStorage ou de um backup.
     Nunca confia no formato: campos desconhecidos são descartados,
     tipos errados viram o valor padrão. */
  function normalizeState(raw){
    if(!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('O conteúdo não é um planejamento válido.');
    if(raw.app && raw.app !== APP_ID) throw new Error('O arquivo não pertence ao Espanha Organizada.');
    if(typeof raw.schema === 'number' && raw.schema > SCHEMA) throw new Error('O backup foi criado por uma versão mais nova do aplicativo.');
    if(!raw.profile || typeof raw.profile !== 'object' || !Array.isArray(raw.tasks)) throw new Error('Faltam partes essenciais do planejamento (perfil ou tarefas).');

    var b = blankState();
    var p = raw.profile;
    b.demo = raw.demo === true;
    b.createdAt = str(raw.createdAt, 40) || b.createdAt;
    b.updatedAt = str(raw.updatedAt, 40) || b.updatedAt;
    b.lastExportAt = str(raw.lastExportAt, 40) || null;
    b.profile = {
      nome:str(p.nome, 60), origem:str(p.origem, 60), cidade:str(p.cidade, 80), chegada:isoOrEmpty(p.chegada),
      estudo:oneOf(p.estudo, ESTUDOS, ''), situacao:oneOf(p.situacao, SITUACOES, ''),
      orcamento:numOrNull(p.orcamento), orcamentoMoeda:oneOf(p.orcamentoMoeda, { EUR:1, BRL:1 }, 'EUR'),
      acompanhado:oneOf(p.acompanhado, ACOMP, ''), onboarded:p.onboarded === true
    };
    b.tasks = raw.tasks.filter(function(t){ return t && typeof t === 'object' && str(t.title); }).slice(0, 2000).map(function(t, i){
      var stage = Number(t.stage);
      return { id:str(t.id, 40) || uid(), stage:(stage >= 1 && stage <= 8) ? Math.floor(stage) : 1, category:str(t.category, 60),
               priority:oneOf(t.priority, PRIORITIES, 'media'), title:str(t.title, 200), desc:str(t.desc, 2000), src:str(t.src, 60),
               link:safeUrl(t.link) || '', status:oneOf(t.status, TSTATUS, 'pendente'), due:isoOrEmpty(t.due), notes:str(t.notes, 4000),
               order:typeof t.order === 'number' && isFinite(t.order) ? t.order : i };
    });
    b.docs = (Array.isArray(raw.docs) ? raw.docs : []).filter(function(d){ return d && typeof d === 'object' && str(d.name); }).slice(0, 1000).map(function(d){
      return { id:str(d.id, 40) || uid(), tpl:str(d.tpl, 40), name:str(d.name, 200), category:str(d.category, 60) || 'Outros',
               person:oneOf(d.person, PERSONS, 'titular'), status:oneOf(d.status, DSTATUS, 'nao-iniciado'),
               issued:isoOrEmpty(d.issued), expires:isoOrEmpty(d.expires), apostila:oneOf(d.apostila, CHECKOPTS, ''),
               traducao:oneOf(d.traducao, CHECKOPTS, ''), notes:str(d.notes, 4000), src:str(d.src, 60), link:safeUrl(d.link) || '' };
    });
    if(Array.isArray(raw.docCategories)){
      var cats = raw.docCategories.map(function(c){ return str(c, 60).trim(); }).filter(Boolean);
      b.docCategories = cats.filter(function(c, i){ return cats.indexOf(c) === i; }).slice(0, 60);
    }
    b.docs.forEach(function(d){ if(b.docCategories.indexOf(d.category) === -1) b.docCategories.push(d.category); });
    if(b.docCategories.indexOf('Outros') === -1) b.docCategories.push('Outros');

    var rb = raw.budget && typeof raw.budget === 'object' ? raw.budget : {};
    b.budget = {
      display:oneOf(rb.display, { EUR:1, BRL:1 }, 'EUR'),
      rate:(numOrNull(rb.rate) !== null && rb.rate > 0) ? rb.rate : null,
      rateDate:isoOrEmpty(rb.rateDate),
      reserve:numOrNull(rb.reserve), reserveCurrency:oneOf(rb.reserveCurrency, { EUR:1, BRL:1 }, 'EUR'),
      items:(Array.isArray(rb.items) ? rb.items : []).filter(function(it){ return it && typeof it === 'object'; }).slice(0, 1000).map(function(it){
        return { id:str(it.id, 40) || uid(), category:str(it.category, 80) || 'Outras despesas', desc:str(it.desc, 200),
                 currency:oneOf(it.currency, { EUR:1, BRL:1 }, 'EUR'), planned:numOrNull(it.planned), actual:numOrNull(it.actual) };
      })
    };
    b.events = (Array.isArray(raw.events) ? raw.events : []).filter(function(e){ return e && typeof e === 'object' && str(e.title) && validISO(e.date); }).slice(0, 2000).map(function(e){
      return { id:str(e.id, 40) || uid(), title:str(e.title, 200), date:e.date, taskId:str(e.taskId, 40), notes:str(e.notes, 4000) };
    });
    b.sources = (Array.isArray(raw.sources) ? raw.sources : []).filter(function(s){ return s && typeof s === 'object' && str(s.title) && safeUrl(s.url); }).slice(0, 200).map(function(s){
      return { id:str(s.id, 40) || uid(), title:str(s.title, 200), url:safeUrl(s.url), notes:str(s.notes, 2000), checked:isoOrEmpty(s.checked) };
    });
    return b;
  }

  /* =========================================================
     PERSISTÊNCIA
     ========================================================= */
  var storage = { ok:true, error:null, lastSaved:null, corruptRaw:null, persisted:null };

  function storageAvailable(){
    try{
      var k = STORAGE_KEY + '.teste';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    }catch(e){ return false; }
  }

  function loadState(){
    if(!storageAvailable()){ storage.ok = false; return null; }
    var raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ storage.ok = false; return null; }
    if(!raw) return null;
    try{
      return normalizeState(JSON.parse(raw));
    }catch(e){
      // Nunca sobrescrever silenciosamente: guarda uma cópia do conteúdo ilegível.
      storage.corruptRaw = raw;
      try{ localStorage.setItem(STORAGE_KEY + '.ilegivel.' + Date.now(), raw); }catch(_){}
      return null;
    }
  }

  function saveState(){
    if(!state) return false;
    state.updatedAt = new Date().toISOString();
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      storage.ok = true; storage.error = null; storage.lastSaved = new Date();
      updateSaveIndicator();
      return true;
    }catch(e){
      storage.error = e;
      updateSaveIndicator();
      toast('Não foi possível salvar neste navegador. Exporte um backup para não perder as alterações.', true);
      return false;
    }
  }

  function requestPersistence(){
    if(!navigator.storage || !navigator.storage.persist) return;
    navigator.storage.persisted().then(function(p){
      if(p){ storage.persisted = true; return; }
      return navigator.storage.persist().then(function(granted){ storage.persisted = !!granted; });
    }).catch(function(){});
  }

  function updateSaveIndicator(){
    document.querySelectorAll('.save-state').forEach(function(el){
      if(!storage.ok || storage.error){
        el.textContent = 'Não salvo — veja Dados';
        el.classList.add('is-error');
      } else if(storage.lastSaved){
        el.textContent = 'Salvo às ' + pad(storage.lastSaved.getHours()) + ':' + pad(storage.lastSaved.getMinutes());
        el.classList.remove('is-error');
      } else {
        el.textContent = 'Salvo neste navegador';
        el.classList.remove('is-error');
      }
    });
  }

  /* Outra aba alterou os dados: adota a versão mais nova em vez de
     sobrescrevê-la no próximo salvamento. */
  window.addEventListener('storage', function(e){
    if(e.key !== STORAGE_KEY) return;
    if(e.newValue === null){ state = null; render(); toast('Os dados foram apagados em outra aba.'); return; }
    try{
      state = normalizeState(JSON.parse(e.newValue));
      closeModal();
      render();
      toast('Dados atualizados a partir de outra aba.');
    }catch(_){}
  });

  var state = loadState();
  var ui = {
    task:{ status:'', stage:'', cat:'', prio:'' },
    doc:{ status:'', person:'', cat:'' },
    tl:{ showDone:false },
    openStages:{},
    ob:{ step:0, draft:null }
  };

  /* =========================================================
     CÁLCULOS
     ========================================================= */
  function sortedTasks(list){
    return list.slice().sort(function(a, b){ return a.stage - b.stage || a.order - b.order; });
  }
  function isOverdue(t){ return t.status !== 'concluida' && t.due && daysFromToday(t.due) < 0; }
  function taskStats(list){
    var s = { total:list.length, done:0, doing:0, todo:0, overdue:0 };
    list.forEach(function(t){
      if(t.status === 'concluida') s.done++; else if(t.status === 'andamento') s.doing++; else s.todo++;
      if(isOverdue(t)) s.overdue++;
    });
    s.pct = s.total ? Math.round(s.done / s.total * 100) : 0;
    return s;
  }
  function currentStage(){
    var sit = SITUACOES[state.profile.situacao];
    return sit ? sit.stage : null;
  }

  function priorityTasks(limit){
    var focus = currentStage() || 1;
    /* Ordem: atrasadas → prazo nos próximos 14 dias → etapas anteriores à
       fase atual (já deveriam ter passado) → prioridade → proximidade da fase. */
    function key(t){
      var d = t.due ? daysFromToday(t.due) : null;
      return [isOverdue(t) ? 0 : 1, (d !== null && d <= 14) ? d : 9999, t.stage < focus ? 0 : 1,
              PRIO_WEIGHT[t.priority], Math.abs(t.stage - focus), t.stage, t.order];
    }
    return state.tasks.filter(function(t){ return t.status !== 'concluida'; }).map(function(t){ return { t:t, k:key(t) }; }).sort(function(a, b){
      for(var i = 0; i < a.k.length; i++){ if(a.k[i] !== b.k[i]) return a.k[i] - b.k[i]; }
      return 0;
    }).map(function(x){ return x.t; }).slice(0, limit);
  }

  function docReady(d){ return d.status === 'pronto' || d.status === 'nao-se-aplica'; }
  function docAlerts(d){
    var out = [];
    if(d.status === 'nao-se-aplica') return out;
    if(d.expires){
      var n = daysFromToday(d.expires);
      if(n < 0) out.push({ kind:'bad', t:'Vencido' });
      else if(n <= 60) out.push({ kind:'warn', t:'Vence ' + relDays(n) });
      if(n >= 0 && state.profile.chegada && d.expires < state.profile.chegada) out.push({ kind:'warn', t:'Vence antes da chegada' });
    }
    if(d.apostila === 'verificar' || d.traducao === 'verificar') out.push({ kind:'pri', t:'Verificar apostila/tradução' });
    return out;
  }
  function docStats(){
    var s = { total:state.docs.length, ready:0, alerts:0 };
    state.docs.forEach(function(d){
      if(docReady(d)) s.ready++;
      if(docAlerts(d).some(function(a){ return a.kind !== 'pri'; })) s.alerts++;
    });
    return s;
  }

  /* Conversão de moeda — só com a taxa informada pelo usuário.
     Retorna null quando não dá para converter. */
  function conv(amount, from, to){
    if(amount === null || amount === undefined) return 0;
    if(from === to) return amount;
    var r = state.budget.rate;
    if(!r) return null;
    return from === 'EUR' ? amount * r : amount / r;
  }
  function budgetSummary(){
    var cur = state.budget.display;
    var s = { cur:cur, planned:0, actual:0, unconverted:0, byCat:{}, filledPlanned:0 };
    state.budget.items.forEach(function(it){
      var p = conv(it.planned, it.currency, cur), a = conv(it.actual, it.currency, cur);
      if((it.planned !== null || it.actual !== null) && (p === null || a === null)){ s.unconverted++; return; }
      if(it.planned !== null) s.filledPlanned++;
      s.planned += p; s.actual += a;
      var c = s.byCat[it.category] || (s.byCat[it.category] = { planned:0, actual:0 });
      c.planned += p; c.actual += a;
    });
    s.planned = round2(s.planned); s.actual = round2(s.actual);
    s.remaining = round2(s.planned - s.actual);
    s.available = state.profile.orcamento !== null ? conv(state.profile.orcamento, state.profile.orcamentoMoeda, cur) : null;
    s.reserve = state.budget.reserve !== null ? conv(state.budget.reserve, state.budget.reserveCurrency, cur) : null;
    return s;
  }

  /* Linha do tempo: chegada (do perfil) + eventos + tarefas com prazo. */
  function timelineItems(includeDone){
    var items = [];
    if(state.profile.chegada) items.push({ kind:'arrival', date:state.profile.chegada, title:'Chegada prevista' + (state.profile.cidade ? ' em ' + state.profile.cidade : '') });
    state.events.forEach(function(e){
      var t = e.taskId ? findTask(e.taskId) : null;
      items.push({ kind:'event', id:e.id, date:e.date, title:e.title, task:t, notes:e.notes });
    });
    state.tasks.forEach(function(t){
      if(!t.due) return;
      if(!includeDone && t.status === 'concluida') return;
      items.push({ kind:'task', id:t.id, date:t.due, title:t.title, task:t });
    });
    return items.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }

  function findTask(id){ for(var i = 0; i < state.tasks.length; i++){ if(state.tasks[i].id === id) return state.tasks[i]; } return null; }
  function findIn(list, id){ for(var i = 0; i < list.length; i++){ if(list[i].id === id) return list[i]; } return null; }
  function removeFrom(list, id){ for(var i = 0; i < list.length; i++){ if(list[i].id === id){ list.splice(i, 1); return true; } } return false; }

  /* =========================================================
     TOAST & DIÁLOGOS
     ========================================================= */
  function toast(msg, isError){
    var box = document.getElementById('toasts');
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' is-error' : '');
    el.setAttribute('role', isError ? 'alert' : 'status');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function(){ el.remove(); }, isError ? 7000 : 3200);
  }

  var dlg = document.getElementById('dlg');
  var dlgReturnFocus = null;
  var dlgOnClose = null;
  var dlgFinished = true;

  function openModal(o){
    if(dlg.open) closeModal();
    dlgReturnFocus = document.activeElement;
    var actions = (o.actions || []).map(function(a, i){
      return '<button type="' + (a.submit ? 'submit' : 'button') + '" ' + (a.submit ? 'form="dlg-form"' : '') +
        ' class="btn ' + (a.kind ? 'btn-' + a.kind : '') + (a.left ? ' left' : '') + '" data-dlg-action="' + i + '"' + (a.disabled ? ' disabled' : '') + '>' + esc(a.label) + '</button>';
    }).join('');
    dlg.innerHTML = '<div class="dlg"><div class="dlg-head"><h2 id="dlg-title">' + esc(o.title) + '</h2>' +
      '<button type="button" class="icon-btn" data-dlg-close aria-label="Fechar">' + icon('x') + '</button></div>' +
      '<div class="dlg-body">' + o.body + '</div>' + (actions ? '<div class="dlg-foot">' + actions + '</div>' : '') + '</div>';
    dlgOnClose = o.onClose || null;
    dlgFinished = false;
    dlg.querySelectorAll('[data-dlg-action]').forEach(function(btn){
      var a = o.actions[Number(btn.dataset.dlgAction)];
      if(a.submit) return;
      btn.addEventListener('click', function(){
        var keep = a.onClick ? a.onClick() : false;
        if(keep !== true) closeModal();
      });
    });
    dlg.querySelector('[data-dlg-close]').addEventListener('click', closeModal);
    dlg.showModal();
    if(o.onOpen) o.onOpen(dlg);
    var first = dlg.querySelector('.dlg-body input, .dlg-body select, .dlg-body textarea');
    if(first && o.autofocus !== false) first.focus();
  }
  /* O fechamento é finalizado de forma síncrona. O evento "close" do
     <dialog> chega depois (assíncrono) e só é usado quando o usuário
     fecha com Esc — se outro diálogo já foi aberto em sequência, ele é
     ignorado para não apagar o diálogo novo. */
  function finishClose(){
    if(dlgFinished) return;
    dlgFinished = true;
    var cb = dlgOnClose; dlgOnClose = null;
    dlg.innerHTML = '';
    if(cb) cb();
    if(dlgReturnFocus && document.contains(dlgReturnFocus)) dlgReturnFocus.focus();
  }
  function closeModal(){
    if(dlg.open) dlg.close();
    finishClose();
  }
  dlg.addEventListener('close', function(){ if(!dlg.open) finishClose(); });

  function confirmAction(o){
    return new Promise(function(resolve){
      var done = false;
      var body = '<p>' + o.message + '</p>' + (o.requireText ?
        '<label class="field" style="margin-top:14px">Para confirmar, digite <strong>' + esc(o.requireText) + '</strong><input type="text" id="confirm-text" autocomplete="off" autocapitalize="characters"></label>' : '');
      openModal({
        title:o.title, body:body, autofocus:!!o.requireText,
        actions:[
          { label:'Cancelar', kind:'' },
          { label:o.confirmLabel || 'Confirmar', kind:o.danger ? 'danger' : 'primary', disabled:!!o.requireText, onClick:function(){ done = true; resolve(true); } }
        ],
        onOpen:function(d){
          if(!o.requireText) return;
          var input = d.querySelector('#confirm-text');
          var btn = d.querySelector('[data-dlg-action="1"]');
          input.addEventListener('input', function(){ btn.disabled = input.value.trim().toUpperCase() !== o.requireText; });
        },
        onClose:function(){ if(!done) resolve(false); }
      });
    });
  }

  /* Formulário genérico em diálogo.
     fields: [{name,label,type,options,required,placeholder,hint,value,row}] */
  function fieldHtml(f){
    var id = 'f-' + f.name;
    var v = f.value == null ? '' : f.value;
    var req = f.required ? ' required aria-required="true"' : '';
    var control;
    if(f.type === 'select'){
      control = '<select id="' + id + '" name="' + f.name + '"' + req + '>' + Object.keys(f.options).map(function(k){
        return '<option value="' + esc(k) + '"' + (String(v) === k ? ' selected' : '') + '>' + esc(f.options[k]) + '</option>';
      }).join('') + '</select>';
    } else if(f.type === 'textarea'){
      control = '<textarea id="' + id + '" name="' + f.name + '" maxlength="' + (f.max || 4000) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>';
    } else if(f.type === 'checkbox'){
      return '<label class="field field-check"><input type="checkbox" id="' + id + '" name="' + f.name + '"' + (v ? ' checked' : '') + '> ' + esc(f.label) + '</label>';
    } else {
      var type = f.type === 'money' ? 'text' : (f.type || 'text');
      var extra = f.type === 'money' ? ' inputmode="decimal" autocomplete="off"' : '';
      if(f.list) extra += ' list="' + id + '-list"';
      control = '<input id="' + id + '" name="' + f.name + '" type="' + type + '" value="' + esc(v) + '" maxlength="' + (f.max || 300) + '" placeholder="' + esc(f.placeholder || '') + '"' + req + extra + '>';
      if(f.list) control += '<datalist id="' + id + '-list">' + f.list.map(function(o){ return '<option value="' + esc(o) + '">'; }).join('') + '</datalist>';
    }
    return '<label class="field" for="' + id + '">' + esc(f.label) + (f.required ? ' *' : '') + control +
      (f.hint ? '<span class="hint">' + f.hint + '</span>' : '') + '</label>';
  }
  function formHtml(fields){
    var out = '', row = [];
    fields.forEach(function(f){
      if(f.row){ row.push(fieldHtml(f)); }
      else {
        if(row.length){ out += '<div class="form-row">' + row.join('') + '</div>'; row = []; }
        out += fieldHtml(f);
      }
    });
    if(row.length) out += '<div class="form-row">' + row.join('') + '</div>';
    return out;
  }
  function openForm(o){
    var body = (o.intro || '') + '<form id="dlg-form" class="form" novalidate>' + formHtml(o.fields) + '<p class="form-error" role="alert" hidden></p></form>';
    var actions = [];
    if(o.onDelete) actions.push({ label:o.deleteLabel || 'Excluir', kind:'danger-ghost', left:true, onClick:function(){
      var del = o.onDelete;
      setTimeout(del, 0);
    } });
    actions.push({ label:'Cancelar', kind:'' });
    actions.push({ label:o.submitLabel || 'Salvar', kind:'primary', submit:true });
    openModal({
      title:o.title, body:body, actions:actions,
      onOpen:function(d){
        var form = d.querySelector('#dlg-form');
        form.addEventListener('submit', function(ev){
          ev.preventDefault();
          var vals = {};
          o.fields.forEach(function(f){
            var el = form.elements[f.name];
            vals[f.name] = f.type === 'checkbox' ? el.checked : el.value.trim();
          });
          form.querySelectorAll('.field.is-invalid').forEach(function(el){ el.classList.remove('is-invalid'); });
          var missing = o.fields.filter(function(f){ return f.required && !vals[f.name]; });
          var err = missing.length ? 'Preencha: ' + missing.map(function(f){ return f.label; }).join(', ') + '.' : o.onSubmit(vals);
          if(err){
            var bad = typeof err === 'object' ? err : { msg:err, field:missing.length ? missing[0].name : null };
            var p = form.querySelector('.form-error');
            p.textContent = bad.msg; p.hidden = false;
            if(bad.field && form.elements[bad.field]){
              form.elements[bad.field].closest('.field').classList.add('is-invalid');
              form.elements[bad.field].focus();
            }
            return;
          }
          closeModal();
        });
      }
    });
  }

  function validateDateField(vals, name, label){
    if(vals[name] && !validISO(vals[name])) return { msg:label + ': data inválida.', field:name };
    return null;
  }

  /* Identifica o controle focado para devolver o foco a ele depois de

  function readObStep(skip){
    var step = OB_STEPS[ui.ob.step];
    var d = obDraft();
    var form = document.querySelector('[data-ob-form]');
    if(!form) return true;
    var err = form.querySelector('[data-ob-error]');
    function fail(msg){ if(err){ err.textContent = msg; err.hidden = false; } return false; }
    if(skip){
      if(step === 'chegada') d.chegada = '';
      if(step === 'orcamento') d.orcamento = null;
      return true;
    }
    if(step === 'nome') d.nome = form.elements.nome.value.trim();
    if(step === 'origem') d.origem = form.elements.origem.value.trim();
    if(step === 'cidade') d.cidade = form.elements.cidade.value.trim();
    if(step === 'chegada'){
      var v = form.elements.chegada.value;
      if(v && !validISO(v)) return fail('Data inválida. Use o seletor de data ou deixe em branco.');
      if(!v && form.elements.chegada.validity && form.elements.chegada.validity.badInput) return fail('Data incompleta ou inválida.');
      d.chegada = v;
    }
    if(step === 'estudo' || step === 'situacao' || step === 'acompanhado'){
      var r = form.querySelector('input[name="' + step + '"]:checked');
      d[step] = r ? r.value : '';
    }
    if(step === 'orcamento'){
      var n = parseNum(form.elements.orcamento.value);
      if(n !== null && (isNaN(n) || n < 0)) return fail('Informe um valor numérico positivo (ex.: 12.000,00) ou deixe em branco.');
      d.orcamento = n === null ? null : round2(n);
      d.orcamentoMoeda = form.elements.orcamentoMoeda.value === 'BRL' ? 'BRL' : 'EUR';
    }
    return true;
  }

  function bindOnboarding(){
    var app = document.getElementById('app');
    app.querySelectorAll('[data-ob]').forEach(function(btn){
      btn.addEventListener('click', function(){ obAction(btn.dataset.ob); });
    });
    var form = app.querySelector('[data-ob-form]');
    if(form){
      form.addEventListener('submit', function(e){ e.preventDefault(); obAction(OB_STEPS[ui.ob.step] === 'resumo' ? 'finish' : 'next'); });
      form.querySelectorAll('input[name="estudo"]').forEach(function(r){
        r.addEventListener('change', function(){ var n = form.querySelector('[data-ob-note]'); if(n) n.textContent = estudoNote(r.value); });
      });
      var first = form.querySelector('input:not([type="radio"]), input[type="radio"]:checked, input[type="radio"]');
      if(first) first.focus();
    }
    var imp = app.querySelector('[data-ob-import]');
    if(imp) imp.addEventListener('change', function(){ if(imp.files[0]) importFile(imp.files[0]); imp.value = ''; });
    var dc = app.querySelector('[data-act="download-corrupt"]');
    if(dc) dc.addEventListener('click', function(){ downloadText(storage.corruptRaw, 'espanha-organizada-dados-ilegiveis.txt', 'text/plain'); });

  function obAction(a){
    if(a === 'demo'){ startDemo(); return; }
    if(a === 'back'){ ui.ob.step = Math.max(0, ui.ob.step - 1); render(); return; }
    if(a === 'next' || a === 'skip'){
      if(!readObStep(a === 'skip')) return;
      ui.ob.step = Math.min(OB_STEPS.length - 1, ui.ob.step + 1);
      render();
      return;
    }
    if(a === 'finish'){
      var st = blankState();
      st.profile = obDraft();
      st.profile.onboarded = true;
      applyTemplate(st);
      state = st;
      ui.ob = { step:0, draft:null };
      saveState();
      requestPersistence();
      location.hash = '#/inicio';
      render();
      toast('Planejamento criado. Tudo é salvo automaticamente neste navegador.');
    }
  }

  function buildDemo(){
    var st = blankState();
    st.demo = true;
    st.profile = { nome:'Exemplo', origem:'Brasil', cidade:'Salamanca', chegada:addDays(110), estudo:'superior', situacao:'documentacao',
                   orcamento:9000, orcamentoMoeda:'EUR', acompanhado:'individual', onboarded:true };
    applyTemplate(st);
    var dueOffsets = [-3, 6, 12, 20, 25];
    var k = 0;
    st.tasks.forEach(function(t){
      if(t.stage <= 2) t.status = 'concluida';
      else if(t.stage === 3) t.status = t.order <= 2 ? 'concluida' : 'andamento';
      else if(t.stage === 4 && k < dueOffsets.length){ t.due = addDays(dueOffsets[k]); t.status = k === 1 ? 'andamento' : 'pendente'; k++; }
      else if(t.stage === 5 && t.order === 3) t.due = addDays(45);
    });
    st.docs.forEach(function(d){
      if(d.tpl === 'tit-passaporte'){ d.status = 'em-maos'; d.issued = addDays(-700); d.expires = addDays(2900); d.apostila = 'nao-necessario'; d.traducao = 'nao-necessario'; }
      if(d.tpl === 'tit-aceitacao'){ d.status = 'pronto'; d.issued = addDays(-20); }
      if(d.tpl === 'tit-antecedentes'){ d.status = 'solicitado'; d.notes = 'Exemplo: verificar com o consulado se a certidão precisa de apostila e tradução.'; }
      if(d.tpl === 'tit-seguro'){ d.status = 'nao-iniciado'; }
    });
    var plan = { 'Curso e matrícula':[3200,3200], 'Documentação':[250,80], 'Traduções e apostilamentos':[2400,1100,'BRL'], 'Passagens':[900,null], 'Bagagem e transporte':[120,null],
                 'Hospedagem inicial':[700,null], 'Caução e aluguel':[1300,null], 'Alimentação':[900,null], 'Transporte público':[120,null], 'Telefone e internet':[60,null],
                 'Seguro':[450,null], 'Reserva de emergência':[1500,null], 'Outras despesas':[200,null] };
    st.budget.items.forEach(function(it){
      var p = plan[it.category];
      if(!p) return;
      it.planned = p[0]; it.actual = p[1]; it.currency = p[2] || 'EUR';
      if(it.category === 'Traduções e apostilamentos') it.desc = 'Exemplo em reais';
    });
    st.budget.rate = 6.2;
    st.budget.rateDate = addDays(-2);
    st.budget.reserve = 1500;
    var protocolo = st.tasks.filter(function(t){ return t.stage === 5 && t.order === 3; })[0];
    st.events = [
      { id:uid(), title:'Agendamento no consulado (exemplo)', date:addDays(30), taskId:protocolo ? protocolo.id : '', notes:'Data fictícia.' },
      { id:uid(), title:'Início das aulas (exemplo)', date:addDays(140), taskId:'', notes:'' }
    ];
    return st;
  }

      (ts.total ? '<div class="big-progress"><strong>' + ts.pct + '%</strong><span class="muted">' + ts.done + ' de ' + ts.total + ' tarefas concluídas</span></div>' +
        '<div class="progress progress-lg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + ts.pct + '" aria-label="Progresso geral"><span style="width:' + ts.pct + '%"></span></div>' +
        '<div class="stat-row"><span>Pendentes <b>' + ts.todo + '</b></span><span>Em andamento <b>' + ts.doing + '</b></span><span' + (ts.overdue ? ' class="neg"' : '') + '>Atrasadas <b' + (ts.overdue ? ' class="neg"' : '') + '>' + ts.overdue + '</b></span></div>'
        : '<p class="kpi-note" style="margin-top:8px">Nenhuma tarefa cadastrada. <a href="#/checklist">Adicionar tarefas</a></p>') +
      '</div>';

    var docCard = '<div class="card"><div class="kpi-label">Documentos prontos</div>' +
      (ds.total ? '<div class="kpi-value">' + ds.ready + ' <span class="muted" style="font-size:1rem">de ' + ds.total + '</span></div>' +
        '<div class="progress" style="margin-top:8px"><span style="width:' + Math.round(ds.ready / ds.total * 100) + '%"></span></div>' +
        '<p class="kpi-note" style="margin-top:8px">' + (ds.alerts ? '<span class="neg">' + ds.alerts + ' com validade a revisar</span>' : 'Nenhum alerta de validade') + '</p>'
        : '<p class="kpi-note" style="margin-top:8px">Nenhum documento. <a href="#/documentos">Adicionar</a></p>') + '</div>';

    var budCard = '<div class="card"><div class="kpi-label">Orçamento (' + bs.cur + ')</div>' +
      (bs.filledPlanned || bs.actual ? '<div class="kpi-value">' + fmtMoney(bs.planned, bs.cur) + '</div><p class="kpi-note">previsto · gasto ' + fmtMoney(bs.actual, bs.cur) + '</p>' +
        '<p class="kpi-note">' + (p.orcamento !== null && bs.available === null ? 'Disponível declarado: sem taxa de câmbio para converter' : bs.available !== null ? 'Disponível declarado: ' + fmtMoney(bs.available, bs.cur) + (bs.planned > bs.available ? ' <span class="neg">(abaixo do previsto)</span>' : '') : 'Orçamento disponível não informado') + '</p>' +
        (bs.unconverted ? '<p class="kpi-note neg">' + bs.unconverted + ' linha(s) sem taxa de câmbio</p>' : '')
        : '<p class="kpi-note" style="margin-top:8px">Nenhum valor preenchido. <a href="#/financeiro">Preencher custos</a></p>') + '</div>';

    var phaseCard = '<div class="card"><div class="kpi-label">Fase atual</div><div class="kpi-value" style="font-size:1.1rem">' +
      (stage ? esc(SITUACOES[p.situacao].t) : 'Não informada') + '</div>' +
      (stage ? '<p class="kpi-note">Etapa sugerida: ' + stage + '. ' + esc(STAGES[stage - 1].t) + '</p>' : '<p class="kpi-note"><a href="#/dados" data-act="profile-edit">Informar situação</a></p>') + '</div>';

    var prio = priorityTasks(5);
    var prioHtml = prio.length ? '<ul class="mini-list">' + prio.map(function(t){
      return '<li><input type="checkbox" class="task-check" data-chg="task-done" data-id="' + t.id + '" aria-label="Concluir: ' + esc(t.title) + '">' +
        '<div class="grow"><button type="button" class="task-title" data-act="task-edit" data-id="' + t.id + '">' + esc(t.title) + '</button>' +
        '<div class="task-meta">' + taskMetaPills(t, true) + '</div></div></li>';
    }).join('') + '</ul>' : (state.tasks.length ? '<div class="empty"><strong>Tudo concluído</strong>Nenhuma tarefa pendente no momento.</div>' :
      '<div class="empty"><strong>Sem tarefas ainda</strong>Adicione suas tarefas ou restaure o modelo inicial em Dados.<br><a class="btn btn-primary" href="#/checklist">Ir para o checklist</a></div>');

    var today = todayISO();
    var upcoming = timelineItems(false).filter(function(i){ return i.date >= today; }).slice(0, 5);
    var datesHtml = upcoming.length ? '<ul class="mini-list">' + upcoming.map(function(i){
      var d = daysFromToday(i.date);
      return '<li><span class="pill ' + (i.kind === 'arrival' ? 'pill-pri' : d <= 7 ? 'pill-warn' : '') + ' num">' + fmtDate(i.date) + '</span><div class="grow">' + esc(i.title) +
        '<div class="small muted">' + (i.kind === 'task' ? 'Prazo de tarefa' : i.kind === 'event' ? 'Evento' : 'Perfil') + ' · ' + relDays(d) + '</div></div></li>';
    }).join('') + '</ul>' : '<div class="empty"><strong>Nenhuma data futura</strong>Defina prazos nas tarefas ou crie eventos no Cronograma.<br><a class="btn" href="#/cronograma">Abrir cronograma</a></div>';

    var shortcuts = '<div class="shortcuts">' + VIEWS.slice(1).map(function(v){ return '<a class="shortcut" href="#/' + v.id + '">' + icon(v.icon) + esc(v.t) + '</a>'; }).join('') + '</div>';

    return hello + nudge +
      '<div class="grid grid-kpi">' + progressCard + docCard + budCard + phaseCard + '</div>' +
      '<div class="grid grid-2 section">' +
        '<div class="card"><h2 style="margin-bottom:6px">Próximas tarefas prioritárias</h2>' + prioHtml + '</div>' +
        '<div class="card"><h2 style="margin-bottom:6px">Datas importantes</h2>' + datesHtml + '</div>' +
      '</div>' +
      '<div class="section"><h2>Atalhos</h2>' + shortcuts + '</div>';
  }

  function taskMetaPills(t, withStage, hideCat){
    var out = [];
    if(withStage) out.push('<span class="pill">Etapa ' + t.stage + '</span>');
    if(t.status === 'andamento') out.push('<span class="pill pill-pri">Em andamento</span>');
    if(t.status === 'concluida') out.push('<span class="pill pill-ok">Concluída</span>');
    if(t.priority === 'alta') out.push('<span class="pill pill-warn">Prioridade alta</span>');
    else if(t.priority === 'baixa') out.push('<span class="pill">Prioridade baixa</span>');
    if(t.due){
      var n = daysFromToday(t.due);
      var cls = t.status === 'concluida' ? '' : n < 0 ? 'pill-bad' : n <= 7 ? 'pill-warn' : '';
      out.push('<span class="pill num ' + cls + '">' + (t.status !== 'concluida' && n < 0 ? 'Atrasada · ' : 'Prazo ') + fmtDate(t.due) + '</span>');
    }
    if(t.category && !withStage && !hideCat) out.push('<span class="pill">' + esc(t.category) + '</span>');
    var link = safeUrl(t.link);
    if(link) out.push('<a class="pill pill-pri" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + icon('ext', 'ic-sm') + (t.src && SOURCE_BY_ID[t.src] ? 'Fonte oficial' : 'Link') + '</a>');
    if(t.notes) out.push('<span class="pill" title="' + esc(t.notes) + '">Com observações</span>');
    return out.join('');
  }

  /* =========================================================
     VIEW — CHECKLIST
     ========================================================= */
  function taskCategories(){
    var cats = [];
    state.tasks.forEach(function(t){ if(t.category && cats.indexOf(t.category) === -1) cats.push(t.category); });
    return cats.sort(function(a, b){ return a.localeCompare(b, 'pt-BR'); });
  }
  function selectHtml(key, scope, label, options, value){
    return '<label class="sr-only" for="flt-' + scope + '-' + key + '">' + esc(label) + '</label><select id="flt-' + scope + '-' + key + '" data-chg="filter" data-scope="' + scope + '" data-key="' + key + '">' +
      '<option value="">' + esc(label) + ': todos</option>' + Object.keys(options).map(function(k){
        return '<option value="' + esc(k) + '"' + (value === k ? ' selected' : '') + '>' + esc(options[k]) + '</option>';
      }).join('') + '</select>';
  }
  function filterTasks(list){
    var f = ui.task;
    return list.filter(function(t){
      if(f.status === 'atrasada'){ if(!isOverdue(t)) return false; }
      else if(f.status === 'abertas'){ if(t.status === 'concluida') return false; }
      else if(f.status && t.status !== f.status) return false;
      if(f.cat && t.category !== f.cat) return false;
      if(f.prio && t.priority !== f.prio) return false;
      return true;
    });
  }

  function taskRow(t, siblings){
    var idx = siblings.indexOf(t);
    return '<li class="task' + (t.status === 'concluida' ? ' is-done' : '') + '">' +
      '<input type="checkbox" class="task-check" data-chg="task-done" data-id="' + t.id + '"' + (t.status === 'concluida' ? ' checked' : '') + ' aria-label="Concluir: ' + esc(t.title) + '">' +
      '<div><button type="button" class="task-title" data-act="task-edit" data-id="' + t.id + '">' + esc(t.title) + '</button>' +
      (t.desc ? '<p class="task-desc">' + esc(t.desc) + '</p>' : '') +
      '<div class="task-meta">' + taskMetaPills(t, false) + '</div></div>' +
      '<div class="task-actions">' +
        '<button type="button" class="icon-btn" data-act="task-up" data-id="' + t.id + '" aria-label="Mover para cima"' + (idx <= 0 ? ' disabled' : '') + '>' + icon('up') + '</button>' +
        '<button type="button" class="icon-btn" data-act="task-down" data-id="' + t.id + '" aria-label="Mover para baixo"' + (idx === siblings.length - 1 ? ' disabled' : '') + '>' + icon('down') + '</button>' +
        '<button type="button" class="icon-btn" data-act="task-edit" data-id="' + t.id + '" aria-label="Editar">' + icon('edit') + '</button>' +
      '</div></li>';
  }

  function stageBlock(st, open, opts){
    var all = sortedTasks(state.tasks.filter(function(t){ return t.stage === st.n; }));
    var shown = filterTasks(all);
    if(opts.hideEmpty && !shown.length) return '';
    var s = taskStats(all);
    var cur = currentStage() === st.n;
    return '<details class="stage' + (s.total && s.done === s.total ? ' stage-done' : '') + (cur ? ' stage-current' : '') + '"' + (open ? ' open' : '') + ' data-stage="' + st.n + '">' +
      '<summary><span class="stage-num">' + st.n + '</span><h3>' + esc(st.t) + (cur ? ' <span class="pill pill-pri">Fase atual</span>' : '') + '</h3>' +
      '<span class="stage-meta num">' + s.done + '/' + s.total + (s.overdue ? ' · <span class="neg">' + s.overdue + ' atrasada' + (s.overdue > 1 ? 's' : '') + '</span>' : '') + '</span>' +
      '<div class="progress"><span style="width:' + s.pct + '%"></span></div></summary>' +
      (shown.length ? '<ul class="task-list">' + shown.map(function(t){ return taskRow(t, all); }).join('') + '</ul>' :
        '<p class="stage-foot muted small">' + (all.length ? 'Nenhuma tarefa desta etapa corresponde aos filtros.' : 'Nenhuma tarefa nesta etapa.') + '</p>') +
      '<div class="stage-foot"><button type="button" class="btn btn-sm" data-act="task-new" data-stage="' + st.n + '">' + icon('plus', 'ic-sm') + 'Adicionar tarefa</button></div>' +
      '</details>';
  }

  function renderChecklist(){
    var ts = taskStats(state.tasks);
    var f = ui.task;
    var stOpts = {}; STAGES.forEach(function(s){ stOpts[s.n] = s.n + '. ' + s.t; });
    var catOpts = {}; taskCategories().forEach(function(c){ catOpts[c] = c; });
    var statusOpts = { abertas:'Não concluídas', pendente:'Pendente', andamento:'Em andamento', concluida:'Concluída', atrasada:'Atrasadas' };
    var filtering = f.status || f.stage || f.cat || f.prio;
    var focus = currentStage();
    var stages = STAGES.filter(function(s){ return !f.stage || String(s.n) === f.stage; });
    var blocks = stages.map(function(s){
      var hasOverdue = state.tasks.some(function(t){ return t.stage === s.n && isOverdue(t); });
      var open = filtering ? true : (s.n in ui.openStages) ? ui.openStages[s.n] : (hasOverdue || (focus ? Math.abs(s.n - focus) <= 1 : s.n <= 2));
      return stageBlock(s, open, { hideEmpty:!!(f.status || f.cat || f.prio) });
    }).join('');
    if(!blocks) blocks = '<div class="empty"><strong>Nenhuma tarefa encontrada</strong>Ajuste os filtros para ver mais tarefas.<br><button type="button" class="btn" data-act="clear-filters" data-scope="task">Limpar filtros</button></div>';

    return '<div class="page-head"><div><h1>Checklist da mudança</h1><p>' + (ts.total ? ts.done + ' de ' + ts.total + ' concluídas (' + ts.pct + '%). ' : '') +
      'As tarefas iniciais são exemplos editáveis, não exigências legais. Ajuste à sua realidade.</p></div>' +
      '<button type="button" class="btn btn-primary" data-act="task-new">' + icon('plus', 'ic-sm') + 'Nova tarefa</button></div>' +
      '<div class="toolbar" role="group" aria-label="Filtros">' +
        selectHtml('status', 'task', 'Status', statusOpts, f.status) +
        selectHtml('stage', 'task', 'Etapa', stOpts, f.stage) +
        selectHtml('cat', 'task', 'Categoria', catOpts, f.cat) +
        selectHtml('prio', 'task', 'Prioridade', PRIORITIES, f.prio) +
        (filtering ? '<button type="button" class="btn btn-sm" data-act="clear-filters" data-scope="task">Limpar filtros</button>' : '') +
      '</div>' + blocks;
  }

  function openTaskForm(t, presetStage, presetCat){
    var isNew = !t;
    t = t || { stage:presetStage || currentStage() || 1, category:presetCat || '', priority:'media', status:'pendente', title:'', desc:'', due:'', notes:'', link:'' };
    var stOpts = {}; STAGES.forEach(function(s){ stOpts[s.n] = s.n + '. ' + s.t; });
    var cats = taskCategories(); ARRIVAL_CATS.forEach(function(c){ if(cats.indexOf(c) === -1) cats.push(c); });
    var srcNote = t.src && SOURCE_BY_ID[t.src] ? '<div class="callout callout-info" style="margin-bottom:14px">' + icon('link') + '<div>Fonte de referência: <strong>' + esc(SOURCE_BY_ID[t.src].title) + '</strong> (' + esc(SOURCE_BY_ID[t.src].org) + '). Endereço verificado em ' + fmtDate(SOURCES_CHECKED) + '.</div></div>' : '';
    openForm({
      title:isNew ? 'Nova tarefa' : 'Editar tarefa', intro:srcNote,
      fields:[
        { name:'title', label:'Título', required:true, value:t.title, max:200 },
        { name:'desc', label:'Descrição', type:'textarea', value:t.desc, max:2000 },
        { name:'stage', label:'Etapa', type:'select', options:stOpts, value:String(t.stage), row:true },
        { name:'category', label:'Categoria', value:t.category, list:cats, max:60, row:true },
        { name:'status', label:'Status', type:'select', options:TSTATUS, value:t.status, row:true },
        { name:'priority', label:'Prioridade', type:'select', options:PRIORITIES, value:t.priority, row:true },
        { name:'due', label:'Prazo (opcional)', type:'date', value:t.due },
        { name:'link', label:'Link de referência', type:'url', value:t.link, placeholder:'https://', max:600 },
        { name:'notes', label:'Observações', type:'textarea', value:t.notes }
      ],
      onDelete:isNew ? null : function(){
        confirmAction({ title:'Excluir tarefa?', message:'A tarefa <strong>' + esc(t.title) + '</strong> será excluída. Eventos ligados a ela continuam no cronograma, sem o vínculo.', confirmLabel:'Excluir', danger:true }).then(function(ok){
          if(!ok) return;
          removeFrom(state.tasks, t.id);
          state.events.forEach(function(e){ if(e.taskId === t.id) e.taskId = ''; });
          saveState(); render(); toast('Tarefa excluída.');
        });
      },
      onSubmit:function(v){
        var e = validateDateField(v, 'due', 'Prazo') || validateUrlField(v, 'link');
        if(e) return e;
        var stage = Number(v.stage);
        var target = isNew ? { id:uid(), src:'' } : t;
        if(!isNew && target.stage !== stage) target.order = nextOrder(stage);
        target.title = v.title; target.desc = v.desc; target.category = v.category; target.status = v.status;
        target.priority = v.priority; target.due = v.due; target.notes = v.notes;
        if(target.link !== v.link) target.src = '';
        target.link = v.link;
        if(isNew){ target.stage = stage; target.order = nextOrder(stage); state.tasks.push(target); }
        else target.stage = stage;
        saveState(); render(); toast(isNew ? 'Tarefa adicionada.' : 'Tarefa atualizada.');
      }
    });
  }
  function nextOrder(stage){
    var max = 0;
    state.tasks.forEach(function(t){ if(t.stage === stage && t.order > max) max = t.order; });
    return max + 1;
  }
  function moveTask(id, dir){
    var t = findTask(id); if(!t) return;
    var sib = sortedTasks(state.tasks.filter(function(x){ return x.stage === t.stage; }));
    sib.forEach(function(x, i){ x.order = i + 1; });
    var i = sib.indexOf(t), j = i + dir;
    if(j < 0 || j >= sib.length) return;
    var tmp = sib[j].order; sib[j].order = t.order; t.order = tmp;
    saveState(); render();
    var btn = document.querySelector('[data-act="task-' + (dir < 0 ? 'up' : 'down') + '"][data-id="' + id + '"]');
    if(btn && !btn.disabled) btn.focus(); else { var e = document.querySelector('[data-act="task-edit"][data-id="' + id + '"]'); if(e) e.focus(); }
  }

  /* =========================================================
     VIEW — DOCUMENTOS
     ========================================================= */
  function renderDocumentos(){
    var f = ui.doc;
    var ds = docStats();
    var catOpts = {}; state.docCategories.forEach(function(c){ catOpts[c] = c; });
    var multiPerson = state.profile.acompanhado === 'acompanhado' || state.docs.some(function(d){ return d.person !== 'titular'; });
    var list = state.docs.filter(function(d){
      if(f.status === 'pendentes'){ if(docReady(d)) return false; }
      else if(f.status === 'alertas'){ if(!docAlerts(d).some(function(a){ return a.kind !== 'pri'; })) return false; }
      else if(f.status && d.status !== f.status) return false;
      if(f.person && d.person !== f.person) return false;
      if(f.cat && d.category !== f.cat) return false;
      return true;
    });
    var statusOpts = { pendentes:'Ainda não prontos', alertas:'Com alerta de validade' };
    Object.keys(DSTATUS).forEach(function(k){ statusOpts[k] = DSTATUS[k]; });
    var filtering = f.status || f.person || f.cat;

    var items = list.length ? '<div class="doc-list">' + list.map(function(d){
      var alerts = docAlerts(d).map(function(a){ return '<span class="pill pill-' + a.kind + '">' + esc(a.t) + '</span>'; }).join('');
      var st = docReady(d) ? 'pill-ok' : d.status === 'solicitado' || d.status === 'em-maos' ? 'pill-pri' : '';
      var link = safeUrl(d.link);
      return '<article class="card doc"><div><div class="doc-head"><button type="button" class="doc-name" data-act="doc-edit" data-id="' + d.id + '">' + esc(d.name) + '</button>' +
        '<span class="pill ' + st + '">' + esc(DSTATUS[d.status]) + '</span>' + (multiPerson ? '<span class="pill">' + esc(PERSONS[d.person]) + '</span>' : '') + alerts + '</div>' +
        '<div class="doc-facts"><span>Categoria: <b>' + esc(d.category) + '</b></span><span>Emissão: <b class="num">' + fmtDate(d.issued) + '</b></span><span>Validade: <b class="num">' + (d.expires ? fmtDate(d.expires) : 'não informada') + '</b></span>' +
        '<span>Apostila: <b>' + esc(CHECKOPTS[d.apostila]) + '</b></span><span>Tradução juramentada: <b>' + esc(CHECKOPTS[d.traducao]) + '</b></span></div>' +
        (d.notes ? '<p class="task-desc" style="margin-top:6px">' + esc(d.notes) + '</p>' : '') +
        (link ? '<p style="margin-top:6px" class="small"><a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + icon('ext', 'ic-sm') + ' ' + (d.src && SOURCE_BY_ID[d.src] ? esc(SOURCE_BY_ID[d.src].title) : 'Fonte / referência') + '</a></p>' : '') +
        '</div><div><button type="button" class="icon-btn" data-act="doc-edit" data-id="' + d.id + '" aria-label="Editar ' + esc(d.name) + '">' + icon('edit') + '</button></div></article>';
    }).join('') + '</div>' :
      (state.docs.length ? '<div class="empty"><strong>Nenhum documento corresponde aos filtros</strong><button type="button" class="btn" data-act="clear-filters" data-scope="doc">Limpar filtros</button></div>' :
        '<div class="empty"><strong>Nenhum documento cadastrado</strong>Liste aqui os documentos exigidos no seu procedimento para controlar situação e validade.<br><button type="button" class="btn btn-primary" data-act="doc-new">Adicionar documento</button></div>');

    return '<div class="page-head"><div><h1>Documentos</h1><p>' + (ds.total ? ds.ready + ' de ' + ds.total + ' prontos. ' : '') + 'Controle situação, validade, apostila e tradução de cada documento.</p></div>' +
      '<div class="btn-row"><button type="button" class="btn" data-act="doc-cats">Categorias</button><button type="button" class="btn btn-primary" data-act="doc-new">' + icon('plus', 'ic-sm') + 'Novo documento</button></div></div>' +
      '<div class="callout callout-info" style="margin-bottom:10px">' + icon('shield') + '<div><strong>Não guarde arquivos aqui.</strong> Este módulo registra apenas informações de controle (nome, situação, datas). Guarde passaporte, certidões e outros documentos sensíveis em local seguro, fora da ferramenta.</div></div>' +
      '<div class="callout callout-warn" style="margin-bottom:16px">' + icon('info') + '<div>A necessidade de apostila ou de tradução juramentada depende do documento, do país emissor e do procedimento. A lista inicial é um exemplo — confirme cada item com a fonte oficial do seu consulado ou órgão.</div></div>' +
      '<div class="toolbar" role="group" aria-label="Filtros">' + selectHtml('status', 'doc', 'Situação', statusOpts, f.status) +
        (multiPerson ? selectHtml('person', 'doc', 'Pessoa', PERSONS, f.person) : '') + selectHtml('cat', 'doc', 'Categoria', catOpts, f.cat) +
        (filtering ? '<button type="button" class="btn btn-sm" data-act="clear-filters" data-scope="doc">Limpar filtros</button>' : '') + '</div>' + items;
  }

  function openDocForm(d){
    var isNew = !d;
    d = d || { name:'', category:state.docCategories[0] || 'Outros', person:'titular', status:'nao-iniciado', issued:'', expires:'', apostila:'', traducao:'', notes:'', link:'' };
    var catOpts = {}; state.docCategories.forEach(function(c){ catOpts[c] = c; });
    openForm({
      title:isNew ? 'Novo documento' : 'Editar documento',
      fields:[
        { name:'name', label:'Nome do documento', required:true, value:d.name, max:200 },
        { name:'category', label:'Categoria', type:'select', options:catOpts, value:d.category, row:true },
        { name:'person', label:'Pessoa', type:'select', options:PERSONS, value:d.person, row:true },
        { name:'status', label:'Situação', type:'select', options:DSTATUS, value:d.status },
        { name:'issued', label:'Data de emissão', type:'date', value:d.issued, row:true },
        { name:'expires', label:'Data de validade', type:'date', value:d.expires, row:true, hint:'Deixe em branco se não se aplica.' },
        { name:'apostila', label:'Apostila', type:'select', options:CHECKOPTS, value:d.apostila, row:true },
        { name:'traducao', label:'Tradução juramentada', type:'select', options:CHECKOPTS, value:d.traducao, row:true },
        { name:'link', label:'Link da fonte oficial', type:'url', value:d.link, placeholder:'https://', max:600 },

      ],

      return '<p class="small muted" style="margin-bottom:12px">Ao remover uma categoria em uso, os documentos passam para “Outros”.</p><ul class="mini-list">' + state.docCategories.map(function(c){
        var used = state.docs.filter(function(d){ return d.category === c; }).length;
        return '<li><div class="grow">' + esc(c) + ' <span class="small muted">(' + used + ')</span></div>' +
          (c === 'Outros' ? '<span class="small muted">padrão</span>' : '<button type="button" class="btn btn-sm btn-danger-ghost" data-cat-del="' + esc(c) + '">Remover</button>') + '</li>';
      }).join('') + '</ul><form id="cat-form" class="form-row" style="margin-top:14px" novalidate><label class="field">Nova categoria<input name="cat" maxlength="60" required></label><div style="align-self:end"><button class="btn btn-primary" type="submit">Adicionar</button></div></form><p class="form-error" id="cat-err" hidden></p>';

      d.querySelectorAll('[data-cat-del]').forEach(function(b){
        b.addEventListener('click', function(){
          var c = b.dataset.catDel;
          state.docCategories = state.docCategories.filter(function(x){ return x !== c; });
          state.docs.forEach(function(doc){ if(doc.category === c) doc.category = 'Outros'; });
          if(ui.doc.cat === c) ui.doc.cat = '';
          saveState(); d.querySelector('.dlg-body').innerHTML = body(); bind(d); render();

      d.querySelector('#cat-form').addEventListener('submit', function(ev){
        ev.preventDefault();

        var err = d.querySelector('#cat-err');

        saveState(); d.querySelector('.dlg-body').innerHTML = body(); bind(d); render();

  function renderFinanceiro(){

    var s = budgetSummary();

      (state.profile.orcamento !== null && state.profile.orcamentoMoeda !== cur) || (b.reserve !== null && b.reserveCurrency !== cur);

        '<button type="button" data-act="fin-display" data-cur="EUR" aria-pressed="' + (cur === 'EUR') + '">€ EUR</button><button type="button" data-act="fin-display" data-cur="BRL" aria-pressed="' + (cur === 'BRL') + '">R$ BRL</button></div></div>' +
      '<label>Taxa de câmbio (1 € = R$)<input class="inline-input" type="text" inputmode="decimal" data-chg="fin-rate" value="' + esc(b.rate ? fmtPlain(b.rate) : '') + '" placeholder="Ex.: 6,20" aria-describedby="rate-help"></label>' +

        (b.rate ? (b.rateDate ? 'Cotação de ' + fmtDate(b.rateDate) + (rateAge !== null && rateAge < -30 ? ' — <span class="neg">tem mais de 30 dias, considere atualizar</span>' : '') + '.' : '<span class="neg">Informe a data da cotação.</span>') : 'Sem taxa, valores em outra moeda não entram nos totais.') + '</p>' +
      '</div>';

    var warn = s.unconverted ? '<div class="callout callout-warn" style="margin-top:12px">' + icon('alert') + '<div>' + s.unconverted + ' linha(s) estão em outra moeda e <strong>ficaram fora dos totais</strong>. Informe a taxa de câmbio acima.</div></div>' :
