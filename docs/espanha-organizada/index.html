      kpi('Total já gasto', fmtMoney(s.actual, cur), s.planned ? Math.round(s.actual / s.planned * 100) + '% do previsto' : 'soma dos valores realizados') +
      kpi('Valor restante', '<span class="' + (s.remaining < 0 ? 'neg' : '') + '">' + fmtMoney(s.remaining, cur) + '</span>', 'previsto − realizado') +
      kpi('Disponível declarado', avail === null ? '—' : avail === undefined ? '—' : fmtMoney(avail, cur),
        state.profile.orcamento === null ? '<a href="#/dados" data-act="profile-edit">informar no perfil</a>' : avail === null ? 'sem taxa para converter' : (gap >= 0 ? 'folga de ' + fmtMoney(gap, cur) + ' sobre o previsto' : '<span class="neg">faltam ' + fmtMoney(-gap, cur) + ' para cobrir o previsto</span>')) +
      '<div class="card"><div class="kpi-label">Reserva financeira disponível</div>' +
        '<div style="display:flex;gap:6px;margin-top:6px"><input class="inline-input" style="flex:1" type="text" inputmode="decimal" data-chg="fin-reserve" value="' + esc(b.reserve !== null ? fmtPlain(b.reserve) : '') + '" placeholder="0,00" aria-label="Reserva disponível">' +
        '<select class="inline-input" style="width:auto" data-chg="fin-reserve-cur" aria-label="Moeda da reserva"><option' + (b.reserveCurrency === 'EUR' ? ' selected' : '') + '>EUR</option><option' + (b.reserveCurrency === 'BRL' ? ' selected' : '') + '>BRL</option></select></div>' +
        '<p class="kpi-note">' + (s.reserve !== null && b.reserveCurrency !== cur ? '≈ ' + fmtMoney(s.reserve, cur) : 'valor já separado para emergências') + '</p></div>' +
      '</div>';

    var rows = b.items.map(function(it){
      var diff = it.planned !== null ? round2(it.planned - (it.actual || 0)) : null;
      return '<tr><td><button type="button" class="task-title" data-act="bud-edit" data-id="' + it.id + '">' + esc(it.category) + '</button>' + (it.desc ? '<div class="small muted">' + esc(it.desc) + '</div>' : '') + '</td>' +
        '<td>' + it.currency + '</td>' +
        '<td class="r"><input class="inline-input" type="text" inputmode="decimal" data-chg="bud-planned" data-id="' + it.id + '" value="' + esc(fmtPlain(it.planned)) + '" placeholder="—" aria-label="Previsto: ' + esc(it.category) + '"></td>' +
        '<td class="r"><input class="inline-input" type="text" inputmode="decimal" data-chg="bud-actual" data-id="' + it.id + '" value="' + esc(fmtPlain(it.actual)) + '" placeholder="—" aria-label="Realizado: ' + esc(it.category) + '"></td>' +
        '<td class="r num ' + (diff === null ? '' : diff < 0 ? 'neg' : 'pos') + '">' + (diff === null ? '—' : fmtMoney(diff, it.currency)) + '</td>' +
        '<td class="r"><button type="button" class="icon-btn" data-act="bud-edit" data-id="' + it.id + '" aria-label="Editar ' + esc(it.category) + '">' + icon('edit') + '</button></td></tr>';
    }).join('');
    var table = b.items.length ? '<div class="table-wrap"><table class="bud-table"><thead><tr><th>Categoria</th><th>Moeda</th><th class="r">Previsto</th><th class="r">Realizado</th><th class="r">Diferença</th><th></th></tr></thead><tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td>Total (' + cur + ')</td><td></td><td class="r num">' + fmtMoney(s.planned, cur) + '</td><td class="r num">' + fmtMoney(s.actual, cur) + '</td><td class="r num ' + (s.remaining < 0 ? 'neg' : 'pos') + '">' + fmtMoney(s.remaining, cur) + '</td><td></td></tr></tfoot></table></div>' +
      '<p class="small muted" style="margin-top:6px">Diferença = previsto − realizado. Negativo (vermelho) significa gasto acima do previsto. Valores aceitam o formato 1.250,00.</p>'
      : '<div class="empty"><strong>Nenhuma linha de orçamento</strong>Adicione categorias de custo para planejar e acompanhar os gastos.<br><button type="button" class="btn btn-primary" data-act="bud-new">Adicionar linha</button></div>';

    var cats = Object.keys(s.byCat).map(function(k){ return { k:k, p:s.byCat[k].planned, a:s.byCat[k].actual }; }).filter(function(c){ return c.p || c.a; })
      .sort(function(x, y){ return Math.max(y.p, y.a) - Math.max(x.p, x.a); });
    var max = cats.reduce(function(m, c){ return Math.max(m, c.p, c.a); }, 0);
    var dist = cats.length ? '<div class="card"><div class="legend"><span><i style="background:color-mix(in srgb, var(--pri) 30%, white)"></i>Previsto</span><span><i style="background:var(--pri-2)"></i>Realizado</span></div><div class="bars">' + cats.map(function(c){
      return '<div class="bar-row"><span>' + esc(c.k) + '</span><div class="bar-track" role="img" aria-label="' + esc(c.k) + ': previsto ' + esc(fmtMoney(c.p, cur)) + ', realizado ' + esc(fmtMoney(c.a, cur)) + '">' +
        '<span class="plan" style="width:' + (max ? c.p / max * 100 : 0) + '%"></span><span class="act" style="width:' + (max ? c.a / max * 100 : 0) + '%"></span></div>' +
        '<span class="num small">' + fmtMoney(c.p, cur) + (s.planned ? ' · ' + Math.round(c.p / s.planned * 100) + '%' : '') + '</span></div>';
    }).join('') + '</div></div>' : '<div class="empty"><strong>Sem valores ainda</strong>A distribuição aparece quando você preencher valores previstos ou realizados.</div>';

    return '<div class="page-head"><div><h1>Financeiro</h1><p>Planeje o previsto e registre o realizado por categoria. Os totais e diferenças são calculados automaticamente.</p></div>' +
      '<button type="button" class="btn btn-primary" data-act="bud-new">' + icon('plus', 'ic-sm') + 'Nova linha</button></div>' +
      settings + warn + kpis +
      '<div class="section"><h2>Detalhamento</h2>' + table + '</div>' +
      '<div class="section"><h2>Distribuição por categoria</h2>' + dist + '</div>';
  }
  function kpi(label, value, note){
    return '<div class="card"><div class="kpi-label">' + esc(label) + '</div><div class="kpi-value">' + value + '</div><p class="kpi-note">' + note + '</p></div>';
  }

  /* =========================================================
     VIEW — CRONOGRAMA
     ========================================================= */
  function renderCronograma(){
    var items = timelineItems(ui.tl.showDone);
    var today = todayISO();
    var overdue = items.filter(function(i){ return i.kind === 'task' && isOverdue(i.task); });
    var future = items.filter(function(i){ return i.date >= today && !(i.kind === 'task' && isOverdue(i.task)); });
    var past = items.filter(function(i){ return i.date < today && !(i.kind === 'task' && isOverdue(i.task)); });

    function item(i){
      var n = daysFromToday(i.date);
      var doneTask = i.kind === 'task' && i.task.status === 'concluida';
      var cls = i.kind === 'arrival' ? 'is-arrival' : (i.kind === 'task' && isOverdue(i.task)) ? 'is-overdue' : (n >= 0 && n <= 7 && !doneTask) ? 'is-soon' : '';
      var p = i.date.split('-');
      var sub = [];
      if(i.kind === 'task'){
        sub.push('<span class="pill">Prazo de tarefa · etapa ' + i.task.stage + '</span>');
        sub.push('<span class="pill ' + (i.task.status === 'concluida' ? 'pill-ok' : i.task.status === 'andamento' ? 'pill-pri' : '') + '">' + TSTATUS[i.task.status] + '</span>');
      } else if(i.kind === 'event'){
        sub.push('<span class="pill pill-pri">Evento</span>');
        if(i.task) sub.push('<span>Tarefa: <button type="button" class="task-title small" data-act="task-edit" data-id="' + i.task.id + '">' + esc(i.task.title) + '</button> (' + TSTATUS[i.task.status].toLowerCase() + ')</span>');
      } else sub.push('<span class="pill pill-pri">Do seu perfil</span>');
      sub.push('<span class="muted">' + (cls === 'is-overdue' ? '<span class="neg">atrasada · prazo ' + relDays(n) + '</span>' : relDays(n)) + '</span>');
      var act = i.kind === 'event' ? '<button type="button" class="icon-btn" data-act="ev-edit" data-id="' + i.id + '" aria-label="Editar evento">' + icon('edit') + '</button>' :
        i.kind === 'task' ? '<button type="button" class="icon-btn" data-act="task-edit" data-id="' + i.id + '" aria-label="Editar tarefa">' + icon('edit') + '</button>' :
        '<button type="button" class="icon-btn" data-act="profile-edit" aria-label="Alterar data de chegada">' + icon('edit') + '</button>';
      return '<li class="tl-item ' + cls + '"><div class="tl-date"><strong>' + p[2] + '/' + p[1] + '</strong><span>' + weekday(i.date) + ' · ' + p[0] + '</span></div>' +
        '<div><div class="tl-title">' + esc(i.title) + '</div><div class="tl-sub">' + sub.join('') + '</div>' + (i.notes ? '<p class="task-desc">' + esc(i.notes) + '</p>' : '') + '</div>' + act + '</li>';
    }

    var body = !items.length ? '<div class="empty"><strong>Nenhuma data cadastrada</strong>Crie eventos (agendamentos, prazos, início das aulas) ou defina prazos nas tarefas. A data de chegada do seu perfil aparece aqui automaticamente.<br><button type="button" class="btn btn-primary" data-act="ev-new">Novo evento</button></div>' :
      (overdue.length ? '<div class="section" style="margin-top:0"><h2 class="neg">Atrasadas (' + overdue.length + ')</h2><ul class="timeline">' + overdue.map(item).join('') + '</ul></div>' : '') +
      '<div class="section"' + (overdue.length ? '' : ' style="margin-top:0"') + '><h2>Próximas datas</h2>' + (future.length ? '<ul class="timeline">' + future.map(item).join('') + '</ul>' : '<p class="muted">Nenhuma data futura.</p>') + '</div>' +
      (past.length ? '<details class="section"><summary style="cursor:pointer;font-weight:700">Datas passadas (' + past.length + ')</summary><ul class="timeline" style="margin-top:12px">' + past.map(item).join('') + '</ul></details>' : '');

    return '<div class="page-head"><div><h1>Cronograma</h1><p>Eventos, prazos das tarefas e a chegada prevista em uma linha do tempo. Alertas aparecem só aqui na tela — a ferramenta não envia notificações.</p></div>' +
      '<button type="button" class="btn btn-primary" data-act="ev-new">' + icon('plus', 'ic-sm') + 'Novo evento</button></div>' +
      '<div class="toolbar"><label class="field field-check"><input type="checkbox" data-chg="tl-done"' + (ui.tl.showDone ? ' checked' : '') + '> Mostrar prazos de tarefas concluídas</label>' +
      '<span class="spacer"></span><span class="small muted"><span class="pill pill-bad">Atrasada</span> <span class="pill pill-warn">Até 7 dias</span></span></div>' + body;
  }

  /* =========================================================
     VIEW — PRIMEIROS DIAS
     ========================================================= */
  function renderChegada(){
    var tasks = sortedTasks(state.tasks.filter(function(t){ return t.stage === 8; }));
    var s = taskStats(tasks);
    var p = state.profile;
    var n = p.chegada ? daysFromToday(p.chegada) : null;
    var cats = ARRIVAL_CATS.slice();
    tasks.forEach(function(t){ if(t.category && cats.indexOf(t.category) === -1) cats.splice(cats.length - 1, 0, t.category); });

    var groups = cats.map(function(c){
      var list = tasks.filter(function(t){ return t.category === c || (c === 'Outros' && !t.category); });
      return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>' + esc(c) + '</h3>' +
        '<button type="button" class="icon-btn" data-act="task-new" data-stage="8" data-cat="' + esc(c) + '" aria-label="Adicionar item em ' + esc(c) + '">' + icon('plus') + '</button></div>' +
        (list.length ? '<ul class="task-list" style="border-top:0;margin-top:4px">' + list.map(function(t){
          return '<li class="task' + (t.status === 'concluida' ? ' is-done' : '') + '" style="padding-left:0;padding-right:0;grid-template-columns:auto 1fr">' +
            '<input type="checkbox" class="task-check" data-chg="task-done" data-id="' + t.id + '"' + (t.status === 'concluida' ? ' checked' : '') + ' aria-label="Concluir: ' + esc(t.title) + '">' +
            '<div><button type="button" class="task-title" data-act="task-edit" data-id="' + t.id + '">' + esc(t.title) + '</button>' + (t.desc ? '<p class="task-desc">' + esc(t.desc) + '</p>' : '') +
            '<div class="task-meta">' + taskMetaPills(t, false, true) + '</div></div></li>';
        }).join('') + '</ul>' : '<p class="small muted" style="margin-top:6px">Nenhum item. Use + para adicionar.</p>') + '</div>';
    }).join('');

    return '<div class="page-head"><div><h1>Primeiros dias na Espanha</h1><p>' + (s.total ? s.done + ' de ' + s.total + ' concluídos. ' : '') +
      (n !== null ? (n > 0 ? 'Faltam ' + n + ' dias para a chegada prevista.' : n === 0 ? 'A chegada prevista é hoje.' : 'Você chegou há ' + (-n) + ' dias (pela data do perfil).') : '') + '</p></div>' +

  /* Se o novo perfil sugere documentos do modelo que ainda não existem
     (ex.: passou a ser mudança acompanhada), oferece incluí-los. */
  function offerProfileDocs(){
    var have = {}; state.docs.forEach(function(d){ if(d.tpl) have[d.tpl] = true; });
    var missing = DOC_TEMPLATE.filter(function(t){ return t.when && t.when(state.profile) && !have[t.tpl]; });
    if(!missing.length) return;
    setTimeout(function(){
      confirmAction({ title:'Adicionar documentos sugeridos?', message:'Com base no perfil atualizado, há ' + missing.length + ' documento(s) de exemplo que ainda não estão na sua lista: <strong>' +
        missing.map(function(t){ return esc(t.name) + ' (' + PERSONS[t.person].toLowerCase() + ')'; }).join(', ') + '</strong>.', confirmLabel:'Adicionar' }).then(function(ok){
        if(!ok) return;
        missing.forEach(function(t){ state.docs.push(docFromTemplate(t)); if(state.docCategories.indexOf(t.cat) === -1) state.docCategories.push(t.cat); });
        saveState(); render(); toast('Documentos adicionados.');
      });
    }, 50);
  }

  /* =========================================================
     BACKUP — exportar / importar
     ========================================================= */
  function downloadText(text, filename, type){
    var blob = new Blob([text], { type:type || 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }
  function exportBackup(){
    var now = new Date();
    state.lastExportAt = now.toISOString();
    var payload = { app:APP_ID, appVersion:APP_VERSION, schema:SCHEMA, exportedAt:now.toISOString(), data:state };
    downloadText(JSON.stringify(payload, null, 2), 'espanha-organizada-backup-' + isoOf(now) + '.json');
    // salva depois de montar o arquivo para que updatedAt continue <= lastExportAt
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(_){}
    render();
    toast('Backup baixado. Guarde o arquivo em local seguro.');
  }
  function importFile(file){
    if(file.size > MAX_IMPORT_BYTES){ toast('Arquivo grande demais para ser um backup do Espanha Organizada.', true); return; }
    var reader = new FileReader();
    reader.onerror = function(){ toast('Não foi possível ler o arquivo.', true); };
    reader.onload = function(){
      var parsed, next;
      try{ parsed = JSON.parse(String(reader.result)); }catch(e){ toast('O arquivo não é um JSON válido.', true); return; }
      try{
        if(!parsed || parsed.app !== APP_ID || !parsed.data) throw new Error('O arquivo não é um backup do Espanha Organizada.');
        next = normalizeState(parsed.data);
      }catch(e){ toast(e.message || 'Backup inválido.', true); return; }
      next.profile.onboarded = true;
      var summary = '<p>O backup de <strong>' + (parsed.exportedAt ? esc(new Date(parsed.exportedAt).toLocaleString('pt-BR')) : 'data desconhecida') + '</strong> contém:</p>' +
        '<ul class="small"><li>' + next.tasks.length + ' tarefas (' + taskStats(next.tasks).done + ' concluídas)</li><li>' + next.docs.length + ' documentos</li><li>' + next.budget.items.length + ' linhas de orçamento</li><li>' + next.events.length + ' eventos e ' + next.sources.length + ' links</li></ul>' +
        (state && state.profile.onboarded ? '<p><strong>Todos os dados atuais deste navegador serão substituídos.</strong> Se quiser, exporte um backup do estado atual antes.</p>' : '');
      confirmAction({ title:'Importar backup?', message:summary, confirmLabel:'Importar e substituir', danger:!!(state && state.profile.onboarded) }).then(function(ok){
        if(!ok) return;
        next.lastExportAt = parsed.exportedAt || next.lastExportAt;
        state = next;
        ui.ob = { step:0, draft:null };
        if(saveState()) toast('Backup importado com sucesso.');
        location.hash = '#/inicio';
        render();
      });
    };
    reader.readAsText(file);
  }

     IMPRESSÃO
     ========================================================= */

    if(!state || !state.profile.onboarded) return;
    var p = state.profile, ts = taskStats(state.tasks), ds = docStats(), bs = budgetSummary();
    var pend = sortedTasks(state.tasks.filter(function(t){ return t.status !== 'concluida'; }));
    var upcoming = timelineItems(false).filter(function(i){ return i.date >= todayISO(); }).slice(0, 12);
    var h = '<h1>Espanha Organizada — resumo do planejamento</h1>' +
      '<p>' + (p.nome ? esc(p.nome) + ' · ' : '') + 'Destino: ' + esc(p.cidade || 'a definir') + ' · Chegada prevista: ' + fmtDate(p.chegada) + ' · Gerado em ' + new Date().toLocaleString('pt-BR') + (state.demo ? ' · <strong>DADOS FICTÍCIOS DE EXEMPLO</strong>' : '') + '</p>' +
      '<h2>Progresso</h2><p>' + ts.done + ' de ' + ts.total + ' tarefas concluídas (' + ts.pct + '%) · ' + ts.overdue + ' atrasada(s) · Documentos prontos: ' + ds.ready + ' de ' + ds.total + '</p>' +
      '<h2>Tarefas pendentes (' + pend.length + ')</h2>' + (pend.length ? '<table><thead><tr><th>Etapa</th><th>Tarefa</th><th>Status</th><th>Prioridade</th><th>Prazo</th></tr></thead><tbody>' +

      '<h2>Orçamento (' + bs.cur + ')</h2><p>Previsto: ' + fmtMoney(bs.planned, bs.cur) + ' · Realizado: ' + fmtMoney(bs.actual, bs.cur) + ' · Restante: ' + fmtMoney(bs.remaining, bs.cur) +
        (state.budget.rate ? ' · Câmbio informado: 1 € = R$ ' + fmtPlain(state.budget.rate) + (state.budget.rateDate ? ' (' + fmtDate(state.budget.rateDate) + ')' : '') : '') + (bs.unconverted ? ' · ' + bs.unconverted + ' linha(s) fora do total por falta de câmbio' : '') + '</p>' +
      '<table><thead><tr><th>Categoria</th><th>Moeda</th><th>Previsto</th><th>Realizado</th></tr></thead><tbody>' + state.budget.items.filter(function(it){ return it.planned !== null || it.actual !== null; }).map(function(it){
        return '<tr><td>' + esc(it.category) + (it.desc ? ' — ' + esc(it.desc) : '') + '</td><td>' + it.currency + '</td><td>' + fmtMoney(it.planned, it.currency) + '</td><td>' + fmtMoney(it.actual, it.currency) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '<h2>Próximas datas</h2>' + (upcoming.length ? '<table><tbody>' + upcoming.map(function(i){ return '<tr><td>' + fmtDate(i.date) + '</td><td>' + esc(i.title) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p>Nenhuma.</p>') +
      '<p class="p-note">Ferramenta de organização pessoal. Não é assessoria jurídica nem serviço de imigração e não garante aprovação de visto ou autorização. Confirme requisitos nas fontes oficiais.</p>';
    document.getElementById('print-root').innerHTML = h;
  }
  window.addEventListener('beforeprint', buildPrint);

        ui.ob.step = 1;
        render();
      });
    }
  };

  function wipeAll(){
    try{
      localStorage.removeItem(STORAGE_KEY);
      Object.keys(localStorage).forEach(function(k){ if(k.indexOf(STORAGE_KEY + '.') === 0) localStorage.removeItem(k); });
    }catch(_){}
    state = null;
    storage.corruptRaw = null;
    ui = { task:{ status:'', stage:'', cat:'', prio:'' }, doc:{ status:'', person:'', cat:'' }, tl:{ showDone:false }, openStages:{}, ob:{ step:0, draft:null } };
    history.replaceState(null, '', location.pathname + location.search);
    render();
  }

  var CHANGES = {
    'task-done':function(el){
      var t = findTask(el.dataset.id); if(!t) return;
      t.status = el.checked ? 'concluida' : 'pendente';
      saveState(); render();
      if(el.checked) toast('Tarefa concluída.');
    },
    'filter':function(el){ ui[el.dataset.scope][el.dataset.key] = el.value; render(); },
    'tl-done':function(el){ ui.tl.showDone = el.checked; render(); },
    'bud-planned':function(el){ setBudgetValue(el, 'planned'); },
    'bud-actual':function(el){ setBudgetValue(el, 'actual'); },
    'fin-rate':function(el){
      var n = parseNum(el.value);
      if(n !== null && (isNaN(n) || n <= 0)){ el.classList.add('is-invalid'); toast('Taxa inválida. Use um número maior que zero, como 6,20.', true); return; }
      state.budget.rate = n === null ? null : Math.round(n * 10000) / 10000;
      if(n !== null && !state.budget.rateDate) state.budget.rateDate = todayISO();
      saveState(); deferRender();
    },
    'fin-rate-date':function(el){
      if(el.value && !validISO(el.value)){ toast('Data da cotação inválida.', true); return; }
      state.budget.rateDate = el.value; saveState(); deferRender();
    },
    'fin-reserve':function(el){
      var n = parseNum(el.value);
      if(n !== null && (isNaN(n) || n < 0)){ el.classList.add('is-invalid'); toast('Valor inválido. Use o formato 1.500,00.', true); return; }
      state.budget.reserve = n === null ? null : round2(n); saveState(); deferRender();
    },
    'fin-reserve-cur':function(el){ state.budget.reserveCurrency = el.value === 'BRL' ? 'BRL' : 'EUR'; saveState(); render(); },
    'import-file':function(el){ if(el.files[0]) importFile(el.files[0]); el.value = ''; }
  };

  function setBudgetValue(el, field){
    var it = findIn(state.budget.items, el.dataset.id); if(!it) return;
    var n = parseNum(el.value);
    if(n !== null && (isNaN(n) || n < 0)){
      el.classList.add('is-invalid');
      toast('Valor inválido em ' + it.category + '. Use o formato 1.250,00.', true);
      return;
    }
    it[field] = n === null ? null : round2(n);
    saveState();
    deferRender();
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if(!el || !state) return;
    var fn = ACTIONS[el.dataset.act];
    if(fn){ if(el.tagName === 'A') e.preventDefault(); fn(el.dataset.id, el, e); }
  });
  // Lembra quais etapas o usuário abriu/fechou, para o redesenho não desfazer.
  document.addEventListener('click', function(e){
    var sum = e.target.closest('details.stage > summary');
    if(!sum) return;
    var det = sum.parentNode;
    setTimeout(function(){ ui.openStages[det.dataset.stage] = det.open; }, 0);
  });
  document.addEventListener('change', function(e){
    var el = e.target.closest('[data-chg]');
    if(!el || !state) return;
    var fn = CHANGES[el.dataset.chg];
    if(fn) fn(el);
  });
  // Enter em campo de valor confirma a edição sem enviar formulário.
  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('inline-input') && e.target.tagName === 'INPUT'){ e.preventDefault(); e.target.blur(); }
  });

  var RENDERERS = { inicio:renderInicio, checklist:renderChecklist, documentos:renderDocumentos, cronograma:renderCronograma,
                    financeiro:renderFinanceiro, chegada:renderChegada, fontes:renderFontes, dados:renderDados };

  // Atualiza contagens de dias quando a data muda com a página aberta.
  var renderedDay = todayISO();
  setInterval(function(){
    if(todayISO() !== renderedDay){ renderedDay = todayISO(); if(state && !dlg.open) render(); }
  }, 60000);

  if(state) requestPersistence();
  render();
})();
</script>
</body>
</html>
