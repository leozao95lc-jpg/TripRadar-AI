<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LIFE OS</title>
<meta name="description" content="Painel pessoal de evolução de vida — hábitos, XP, níveis, missões e conquistas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================= DESIGN TOKENS ============================= */
:root{
  --bg:#080b12; --bg-elev:#0b0f17; --card:#111722; --card2:#151c28;
  --text:#f5f7fa; --text-dim:#c7ced9; --muted:#8b95a7; --border:#202938; --border-soft:#182131;
  --accent:#2dd4bf; --accent-dim:#17a398; --accent-soft:rgba(45,212,191,.14);
  --warning:#f0b34d; --danger:#f0596a;
  --success:var(--accent);
  --radius-lg:20px; --radius:15px; --radius-sm:11px;
  --shadow-sm:0 2px 12px rgba(0,0,0,.22);
  --shadow:0 16px 38px -10px rgba(0,0,0,.5);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:18px; --sp-5:26px; --sp-6:38px;
  --font: "Inter", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --font-display: "Manrope", var(--font);
}
[data-theme="light"]{
  --bg:#f3f5f8; --bg-elev:#ffffff; --card:#ffffff; --card2:#f1f4f8;
  --text:#10141c; --text-dim:#3d4757; --muted:#666f80; --border:#e3e7ee; --border-soft:#edf0f5;
  --accent:#0e9c8c; --accent-dim:#0b8276; --accent-soft:rgba(14,156,140,.12);
  --shadow-sm:0 2px 12px rgba(20,30,50,.05);
  --shadow:0 16px 38px -12px rgba(20,30,50,.13);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text); font-family:var(--font); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,h4{margin:0 0 4px 0; font-family:var(--font-display); font-weight:700; letter-spacing:-.3px;}
p{margin:0 0 8px 0;}
a{color:var(--accent); text-decoration:none;}
button{font-family:inherit;}
input,select,textarea{
  font-family:inherit; background:var(--card2); color:var(--text); border:1px solid var(--border);
  border-radius:10px; padding:10px 12px; font-size:14px; transition:border-color .15s, box-shadow .15s;
}
input::placeholder,textarea::placeholder{color:var(--muted);}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.hidden{display:none !important;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::selection{background:var(--accent-soft);}

/* ============================= LAYOUT ============================= */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:250px; flex:0 0 250px; background:var(--bg-elev); border-right:1px solid var(--border-soft);
  padding:20px 14px; display:flex; flex-direction:column; gap:1px; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:60;
  transition:width .2s ease, flex-basis .2s ease;
}
.sidebar.collapsed{width:76px; flex:0 0 76px;}
.sidebar.collapsed .navitem span:not(.ic){display:none;}
.sidebar.collapsed .brand .name, .sidebar.collapsed .brand .sub{display:none;}
.sidebar.collapsed .navitem{justify-content:center;}
.sidebar.collapsed .navitem .ic{width:auto;}
.brand{display:flex; align-items:center; gap:11px; padding:4px 10px 20px 8px;}
.brand .logo{
  font-size:17px; width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:0 0 36px;
  background:var(--card2); border:1px solid var(--border-soft); color:var(--accent); font-family:var(--font-display); font-weight:800;
}
.brand .name{font-family:var(--font-display); font-weight:800; font-size:16px; letter-spacing:.1px;}
.brand .sub{font-size:11px; color:var(--muted); margin-top:1px;}
.navitem{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; cursor:pointer;
  color:var(--text-dim); font-size:13.5px; font-weight:600; transition:background .15s, color .15s;
  user-select:none; position:relative;
}
.navitem:hover{background:var(--card2); color:var(--text);}
.navitem.active{background:var(--accent-soft); color:var(--accent);}
.navitem.active::before{content:''; position:absolute; left:-14px; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--accent);}
.navitem .ic{font-size:15px; width:20px; text-align:center; opacity:.9;}
.sidebar-collapse-btn{background:none; border:1px solid var(--border-soft); color:var(--muted); border-radius:9px; padding:7px; cursor:pointer; margin:6px 4px 14px; align-self:flex-end; font-size:13px;}
.sidebar-foot{margin-top:auto; padding:10px; font-size:10.5px; color:var(--muted); line-height:1.5;}
.sidebar.collapsed .sidebar-foot{display:none;}

.topbar{
  display:none; align-items:center; justify-content:space-between; padding:12px 16px;
  background:var(--bg-elev); border-bottom:1px solid var(--border-soft); position:sticky; top:0; z-index:40;
}
.hamburger{background:none;border:none;font-size:20px;color:var(--text);cursor:pointer;padding:6px 10px;border-radius:9px;}
.hamburger:active{background:var(--card2);}
.topbar .tb-brand{font-family:var(--font-display); font-weight:800; font-size:14px; display:flex; align-items:center; gap:7px;}
.bottom-nav{display:none; position:fixed; left:0; right:0; bottom:0; z-index:45; background:var(--bg-elev); border-top:1px solid var(--border-soft); padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.bottom-nav-inner{display:flex; overflow-x:auto; gap:2px;}
.bottom-nav-item{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 12px; border-radius:10px; color:var(--muted); font-size:10px; font-weight:700; cursor:pointer; min-width:58px;}
.bottom-nav-item.active{color:var(--accent); background:var(--accent-soft);}
.bottom-nav-item .ic{font-size:17px;}

.main{flex:1; min-width:0; padding:30px 34px 70px; max-width:1180px; margin:0 auto; width:100%;}
.view{display:none; animation:fadein .3s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.overlay-bg{position:fixed; inset:0; background:rgba(2,4,8,.6); backdrop-filter:blur(2px); z-index:55; display:none;}
.overlay-bg.show{display:block;}

@media (max-width:900px){
  .topbar{display:flex;}
  .bottom-nav{display:block;}
  .sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow); width:250px !important; flex-basis:250px !important;}
  .sidebar.open{transform:translateX(0);}
  .main{padding:16px 14px 96px;}
}

/* ============================= COMPONENTS ============================= */
.grid{display:grid; gap:var(--sp-4); grid-template-columns:repeat(auto-fit,minmax(225px,1fr));}
.grid-2{display:grid; gap:var(--sp-4); grid-template-columns:repeat(auto-fit,minmax(340px,1fr));}
.grid-3{display:grid; gap:var(--sp-4); grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.card{
  background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:20px;
  box-shadow:var(--shadow-sm); transition:box-shadow .2s, transform .2s, border-color .2s;
}
.card.hoverable:hover{transform:translateY(-2px); border-color:var(--border);}
.card.tight{padding:16px;}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px;}
.card-title{font-family:var(--font-display); font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; letter-spacing:.1px;}
.muted{color:var(--muted); font-size:13px;}
.dim{color:var(--text-dim);}
.accent-text{color:var(--accent);}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.row.between{justify-content:space-between;}
.stack{display:flex; flex-direction:column; gap:10px;}

.bar{height:9px; background:var(--card2); border-radius:20px; overflow:hidden; border:1px solid var(--border-soft);}
.bar>span{display:block; height:100%; background:var(--accent); border-radius:20px; transition:width .6s cubic-bezier(.22,.9,.3,1);}
.bar.sm{height:6px;}
.bar.warn>span{background:var(--warning);}
.bar.danger>span{background:var(--danger);}

.btn{
  border:1px solid var(--border); background:var(--card2); color:var(--text); padding:9px 15px; border-radius:11px;
  font-size:13px; font-weight:600; cursor:pointer; transition:transform .12s, background .15s, border-color .15s, box-shadow .15s;
  display:inline-flex; align-items:center; gap:6px; letter-spacing:.1px;
}
.btn:hover{background:var(--border-soft); border-color:var(--border);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent); border:1px solid var(--accent); color:#03251f; font-weight:700;}
.btn.primary:hover{background:var(--accent-dim); border-color:var(--accent-dim);}
.btn.success{background:var(--accent); border:none; color:#03251f; font-weight:700;}
.btn.danger{background:var(--danger); border:none; color:#2a0006;}
.btn.ghost{background:transparent; border-color:var(--border-soft);}
.btn.xs{padding:5px 10px; font-size:11.5px; border-radius:9px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:20px; background:var(--card2); border:1px solid var(--border-soft); color:var(--muted); letter-spacing:.2px; text-transform:uppercase;}
.badge.primary{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
.badge.success{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
.badge.warn{background:rgba(240,179,77,.15); color:var(--warning); border-color:transparent;}
.badge.danger{background:rgba(240,89,106,.15); color:var(--danger); border-color:transparent;}

.chip{padding:7px 13px; border-radius:20px; border:1px solid var(--border); background:var(--card2); font-size:12px; font-weight:600; cursor:pointer; color:var(--text-dim); transition:.15s;}
.chip.active{background:var(--accent); border-color:var(--accent); color:#03251f;}

.check-item{display:flex; align-items:center; gap:13px; padding:13px 14px; border-radius:13px; background:var(--card2); border:1px solid var(--border-soft); transition:.15s;}
.check-item.done{border-color:rgba(45,212,191,.35); background:var(--accent-soft);}
.check-item .cbox{
  width:23px;height:23px;border-radius:50%;border:2px solid var(--border); flex:0 0 23px;
  display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer; color:transparent; transition:.15s;
}
.check-item.done .cbox{background:var(--accent); border-color:var(--accent); color:#03251f;}
.check-item .ic-badge{font-size:15px; opacity:.95;}
.check-item .body{flex:1; min-width:0;}
.check-item .title{font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:7px;}
.check-item .desc{font-size:11.5px; color:var(--muted);}
.check-item.xp-pop{animation:xppop .5s ease;}
@keyframes xppop{ 0%{transform:scale(1);} 30%{transform:scale(1.015); box-shadow:0 0 0 4px var(--accent-soft);} 100%{transform:scale(1);} }

.list-item{padding:12px 14px; border-radius:12px; background:var(--card2); border:1px solid var(--border-soft); margin-bottom:8px;}
.list-item:last-child{margin-bottom:0;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:9px 8px; text-align:left; border-bottom:1px solid var(--border-soft);}
th{color:var(--muted); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px;}

.modal-overlay{position:fixed; inset:0; background:rgba(2,4,8,.65); backdrop-filter:blur(2px); z-index:200; display:none; align-items:center; justify-content:center; padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg-elev); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:24px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow); animation:modalin .18s ease;}
@keyframes modalin{from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;}}
.modal h3{margin-bottom:16px; font-size:17px;}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:13px;}
.field label{font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.3px;}
.field input,.field select,.field textarea{width:100%;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:300; display:flex; flex-direction:column; gap:8px; max-width:320px;}
.toast{background:var(--bg-elev); border:1px solid var(--border-soft); border-left:3px solid var(--accent); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow); font-size:13px; animation:toastin .25s ease;}
@keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1;}}

.emoji-row{display:flex; gap:8px; flex-wrap:wrap;}
.emoji-btn{font-size:21px; padding:9px 13px; border-radius:13px; background:var(--card2); border:2px solid transparent; cursor:pointer; transition:.15s;}
.emoji-btn.sel{border-color:var(--accent); background:var(--accent-soft);}

.week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
.week-day{text-align:center; padding:12px 4px; border-radius:13px; background:var(--card2); border:1px solid var(--border-soft);}
.week-day .dname{font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.3px;}
.week-day .icons{display:flex; flex-direction:column; gap:5px; margin-top:8px; font-size:14px;}
.week-day.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
.week-day.rest{background:var(--accent-soft);}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-cell{aspect-ratio:1; border-radius:11px; background:var(--card2); border:1px solid var(--border-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; cursor:pointer; gap:3px; position:relative; transition:.15s;}
.cal-cell:hover{background:var(--border-soft); transform:translateY(-1px);}
.cal-cell.empty{background:transparent; border:none; cursor:default;}
.cal-cell.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
.cal-cell .dnum{font-weight:700;}
.cal-cell .dots{display:flex; gap:2px;}
.dot{width:5px;height:5px;border-radius:50%;}

.progress-ring-label{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; font-size:12px;}
.big-num{font-family:var(--font-display); font-size:26px; font-weight:800;}
.big-num.accent{color:var(--accent);}

.timeline-item{display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--border-soft);}
.timeline-item:last-child{border-bottom:none;}
.timeline-dot{width:11px;height:11px;border-radius:50%;background:var(--accent); flex:0 0 11px; margin-top:6px;}
.photo-grid{display:flex; gap:8px; flex-wrap:wrap; margin-top:9px;}
.photo-grid img{width:80px;height:80px;object-fit:cover;border-radius:12px; border:1px solid var(--border-soft);}

.mission-row{display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:12px; background:var(--card2); border:1px solid var(--border-soft); margin-bottom:8px;}
.mission-row .stat-dot{font-size:17px; cursor:pointer;}
.mission-row .m-body{flex:1; min-width:0;}
.mission-row .m-title{font-weight:600; font-size:13px;}
.mission-row .m-meta{font-size:10.5px; color:var(--muted);}

canvas{max-width:100%;}
.chart-box{position:relative; height:230px;}

.hero{
  border-radius:var(--radius-lg); padding:26px 28px; position:relative; overflow:hidden;
  background:var(--card); border:1px solid var(--border-soft); margin-bottom:22px;
}
.hero::before{content:''; position:absolute; inset:0; background:radial-gradient(460px 220px at 100% 0%, var(--accent-soft), transparent 70%); pointer-events:none;}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; position:relative;}
.hero h1{font-size:23px;}
.hero .quote{font-size:13px; color:var(--muted); margin-top:5px;}
.hero-stats{display:flex; gap:24px; flex-wrap:wrap;}
.hero-stat{text-align:center; min-width:52px;}
.hero-stat .v{font-family:var(--font-display); font-size:19px; font-weight:800;}
.hero-stat .v.accent{color:var(--accent);}
.hero-stat .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-top:1px;}

.section-title{font-size:11.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); font-weight:800; margin:30px 0 13px; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:0;}
.section-title::after{content:''; flex:1; height:1px; background:var(--border-soft);}
.section-title .link{margin-left:auto; font-size:11px; text-transform:none; letter-spacing:0; font-weight:700; color:var(--accent); cursor:pointer; flex:0 0 auto;}
.section-title .link::before{display:none;}

.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:520px){.two-col{grid-template-columns:1fr;}}

.empty-state{text-align:center; padding:34px 12px; color:var(--muted); font-size:13px;}
.empty-state .ic{font-size:26px; display:block; margin-bottom:8px; opacity:.7;}

/* ---- tabs (Progresso) ---- */
.tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; border-bottom:1px solid var(--border-soft); padding-bottom:0;}
.tab{padding:9px 14px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; border-radius:10px 10px 0 0; position:relative; top:1px;}
.tab.active{color:var(--accent); border-bottom:2px solid var(--accent);}

/* ---- Life Score ---- */
.life-score-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:14px;}
@media (max-width:640px){.life-score-grid{grid-template-columns:repeat(2,1fr);}}
.score-item{text-align:left;}
.score-item .row.between{margin-bottom:6px; font-size:12px;}
.score-item .sv{font-family:var(--font-display); font-weight:800; font-size:15px;}

/* ---- trips ---- */
.trip-card{border-radius:var(--radius-lg); overflow:hidden; background:var(--card); border:1px solid var(--border-soft); box-shadow:var(--shadow-sm); transition:transform .2s, border-color .2s;}
.trip-card:hover{transform:translateY(-3px); border-color:var(--border);}
.trip-cover{height:130px; background:linear-gradient(135deg, var(--card2), var(--border-soft)); display:flex; align-items:center; justify-content:center; font-size:34px; position:relative; overflow:hidden;}
.trip-cover img{width:100%; height:100%; object-fit:cover;}
.trip-status{position:absolute; top:10px; right:10px;}
.trip-body{padding:14px 16px;}
.trip-title{font-family:var(--font-display); font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:6px;}
.trip-meta{font-size:11.5px; color:var(--muted); margin-top:4px;}
.trip-stats{display:flex; gap:14px; margin-top:10px; font-size:11.5px; color:var(--text-dim);}
.country-chip{display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:20px; background:var(--card2); border:1px solid var(--border-soft); font-size:12px; font-weight:600;}
.country-dot{width:7px; height:7px; border-radius:50%;}
.legend-row{display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-bottom:12px;}
.legend-row .li{display:flex; align-items:center; gap:6px;}

/* ---- journal / reflexões ---- */
.journal-entry{padding:16px; border-radius:13px; background:var(--card2); border:1px solid var(--border-soft); margin-bottom:10px;}
.journal-entry .je-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.journal-entry .je-date{font-weight:700; font-size:12.5px;}
.journal-entry .je-mood{font-size:16px;}
.journal-entry .je-text{font-size:13.5px; color:var(--text-dim); white-space:pre-wrap;}

/* ============================= COACH CHAT ============================= */
.coach-wrap{display:flex; flex-direction:column; height:min(68vh,620px); background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm);}
.coach-msgs{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px;}
.coach-msg{max-width:78%; padding:11px 15px; border-radius:16px; font-size:13.5px; line-height:1.5; white-space:pre-wrap;}
.coach-msg.user{align-self:flex-end; background:var(--accent); color:#03251f; border-bottom-right-radius:4px; font-weight:600;}
.coach-msg.assistant{align-self:flex-start; background:var(--card2); border:1px solid var(--border-soft); border-bottom-left-radius:4px;}
.coach-msg.system{align-self:center; color:var(--muted); font-size:12px; background:none;}

<script>
/* ================================================================
   LIFE OS — script único (dados / lógica / UI)
   Estrutura do arquivo:
   1) CONSTANTES E DADOS PADRÃO
   2) PERSISTÊNCIA (localStorage) + import/export
   3) HELPERS DE DATA
   4) XP / NÍVEL / STREAKS / CONSISTÊNCIA
   5) MOTOR DE RECÁLCULO DIÁRIO (XP automático)
   6) NAVEGAÇÃO / RENDER ROOT
   7) VIEWS (dashboard, checkin, saude, mente, ia, carreira, vida,
      experiencias, financas, semana, mes, graficos, future, config)
   8) MODAL / TOAST helpers
   9) DISPATCH DE AÇÕES (data-action)
   10) NOTIFICAÇÕES / LEMBRETES
   11) INIT
   ================================================================ */

/* ============================= 1) CONSTANTES ============================= */
const STORAGE_KEY = 'lifeos_v1';

const WEEKLY_PLAN = {
  0:{type:'descanso',    label:'Descanso',            icon:'🛌'},
  1:{type:'corrida',     label:'Corrida',             icon:'🏃'},
  2:{type:'caminhada',   label:'Caminhada',           icon:'🚶'},
  3:{type:'corrida',     label:'Corrida',             icon:'🏃'},
  4:{type:'caminhada',   label:'Caminhada',           icon:'🚶'},
  5:{type:'corrida',     label:'Corrida',             icon:'🏃'},
  6:{type:'caminhada_opcional', label:'Caminhada opcional', icon:'🚶'},
};

const LEVEL_NAMES = ['COMEÇO','CONSISTÊNCIA','DISCIPLINA','EVOLUÇÃO','EXPANSÃO','LIBERDADE','MAESTRIA','TRANSFORMAÇÃO','LEGADO','LENDA'];

const MOOD_EMOJI = ['😞','😕','😐','🙂','😁'];

const DEFAULT_MISSIONS_ESPANHA = [
  {title:'Preparar CV', icon:'📄', category:'documentacao'},

  {title:'Abrir conta bancária', icon:'🏦', category:'banco'},

const DEFAULT_QUESTS = [

];

function defaultXpValues(){

const XP_LABELS = {
  corrida:'🏃 Corrida', caminhada:'🚶 Caminhada', agua:'💧 Meta de água', sono:'😴 Sono adequado',
  espanhol:'🇪🇸 Meta de espanhol', aprendizado:'📚 Aprendizado (IA)', pratica:'🧪 Prática (IA)',
  projeto:'🚀 Projeto criado (IA)', vidaDois:'❤️ Tempo de qualidade', experiencia:'🌎 Life Quest concluída',
  aportePer100:'💰 Aporte (por €100)', missao:'💼 Missão concluída', registro:'📝 Check-in diário',
};

function defaultReminders(){

    morning:{enabled:true, time:'07:00', label:'☀️ Bom dia, Léo. Hoje é dia de treino.'},
    water:{enabled:true, time:'12:30', label:'💧 Como está sua hidratação?'},

    sleep:{enabled:true, time:'22:00', label:'😴 Está chegando a hora de descansar.'},

}

function defaultData(){
  return {
    meta:{version:1, createdAt:new Date().toISOString()},
    profile:{name:'Léo', xp:0, theme:'dark'},
    settings:{
      waterGoal:2000, stepsBase:8000, spanishGoal:45, sleepGoalMin:7, sleepGoalMax:8,

    relationship:{memories:[]},

      umAno: DEFAULT_FUTURE.umAno.map(t=>({id:uid(),text:t,done:false})),

    } : DEFAULT_FUTURE,
  };
}

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ============================= 2) PERSISTÊNCIA ============================= */
let data = null;

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ data = defaultData(); save(); return; }
    const parsed = JSON.parse(raw);
    data = Object.assign(defaultData(), parsed);
    // merge nested defaults to survive version upgrades
    data.settings = Object.assign(defaultData().settings, parsed.settings||{});
    data.settings.xpValues = Object.assign(defaultXpValues(), (parsed.settings||{}).xpValues||{});
    data.settings.reminders = Object.assign(defaultReminders(), (parsed.settings||{}).reminders||{});
    data.progression = Object.assign(defaultData().progression, parsed.progression||{});
    data.days = parsed.days || {};
    data.career = Object.assign(defaultData().career, parsed.career||{});
    data.finance = Object.assign(defaultData().finance, parsed.finance||{});
    data.relationship = Object.assign(defaultData().relationship, parsed.relationship||{});
    data.quests = parsed.quests || defaultData().quests;
    data.aiLog = parsed.aiLog || [];
    data.achievements = parsed.achievements || [];
    data.futureMe = parsed.futureMe || defaultData().futureMe;
    data.coach = Object.assign({messages:[]}, parsed.coach||{});
    data.trips = parsed.trips || [];
    data.settings.lifeScoreWeights = Object.assign(defaultData().settings.lifeScoreWeights, (parsed.settings||{}).lifeScoreWeights||{});
  }catch(e){
    console.error('Falha ao carregar dados, iniciando novo LIFE OS', e);
    data = defaultData();
  }
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    toast('⚠️ Não foi possível salvar (armazenamento local cheio). Exporte seus dados e remova fotos antigas.', 'warn');
    console.error(e);
  }
}

function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lifeos-backup-'+todayKey()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('📤 Backup exportado com sucesso.', 'ok');
}

function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.profile || !parsed.settings){ throw new Error('formato inválido'); }
      data = parsed;
      save();
      toast('📥 Dados importados com sucesso.', 'ok');
      renderAll();
    }catch(e){
      toast('❌ Arquivo inválido. Verifique se é um backup do LIFE OS.', 'danger');
    }
  };
  reader.readAsText(file);
}

/* ============================= 3) HELPERS DE DATA ============================= */
function pad(n){ return n.toString().padStart(2,'0'); }
function fmtKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayKey(){ return fmtKey(new Date()); }
function parseKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(d,n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtBR(k){ const d = parseKey(k); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function dayShort(d){ return ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'][d.getDay()]; }
function startOfWeek(d){ const r = new Date(d); const diff = (r.getDay()+6)%7; r.setDate(r.getDate()-diff); r.setHours(0,0,0,0); return r; } // Monday
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function pct(v,goal){ return goal>0 ? clamp(Math.round(v/goal*100),0,999) : 0; }

/* ============================= DAY RECORD ============================= */
function computeStepsGoal(dateObj){
  const base = data.settings.stepsBase;
  const plan = WEEKLY_PLAN[dateObj.getDay()];
  if(plan.type==='corrida') return base + 2000;
  if(plan.type==='caminhada' || plan.type==='caminhada_opcional') return base + 1000;
  return Math.max(4000, base - 2000);
}

function defaultDay(dateObj){
  const plan = WEEKLY_PLAN[dateObj.getDay()];
  return {
    exercise:{ type: plan.type==='descanso' ? 'descanso' : '', durationMin:0, distanceKm:0, done: plan.type==='descanso', planned:plan.type },
    steps:{ goal: computeStepsGoal(dateObj), actual:0 },
    water:{ ml:0 },
    meals:{ cafe:[], almoco:[], lanche:[], jantar:[], outros:[] },
    mealRating: null,
    sleep:{ sleepTime:'', wakeTime:'', hours:0, quality:0 },
    mood:{ score:0, note:'' },
    journal:'',
    spanish:{ minutes:0, skills:[], note:'' },
    qualityTime:{ done:false, note:'' },
    checkin:{ done:false },
    xpEarned:0,
    xpLog:[],
    xpFlags:{ exercise:false, water:false, sleep:false, spanish:false, checkin:false, qualityTime:false },
  };
}

function getDay(key){
  if(!data.days[key]){
    data.days[key] = defaultDay(parseKey(key));
  }
  // backfill in case of older/partial records
  const d = data.days[key];
  if(!d.xpFlags) d.xpFlags = { exercise:false, water:false, sleep:false, spanish:false, checkin:false, qualityTime:false };
  if(!d.xpLog) d.xpLog = [];
  if(d.journal===undefined) d.journal = '';
  return d;
}
function peekDay(key){ return data.days[key] || null; }

/* ============================= 4) XP / NÍVEL / STREAKS ============================= */
function xpForLevel(n){ return 200 + (n-1)*100; }
function levelFromXp(xp){
  let lvl=1, rem=xp, need=xpForLevel(1);
  while(rem>=need){ rem-=need; lvl++; need=xpForLevel(lvl); }
  return {level:lvl, into:rem, need};
}
function levelName(n){ return n<=10 ? LEVEL_NAMES[n-1] : ('LENDA +'+(n-9)); }

function addXP(amount, source, dayKey){
  if(!amount || amount<=0) return;
  dayKey = dayKey || todayKey();
  const prevLevel = levelFromXp(data.profile.xp).level;
  data.profile.xp += amount;
  const day = getDay(dayKey);
  day.xpEarned += amount;
  day.xpLog.push({source, amount, time:new Date().toISOString()});
  const newLevel = levelFromXp(data.profile.xp).level;
  if(newLevel>prevLevel){
    toast('🏆 LEVEL UP! Você chegou ao nível '+newLevel+' — '+levelName(newLevel), 'ok');
  }
}

function awardOnce(day, flag, amount, source, dayKey){
  if(!day.xpFlags[flag]){
    day.xpFlags[flag] = true;
    addXP(amount, source, dayKey);
  }
}

function computeStreak(predicate, opts){
  opts = opts || {};
  let count = 0;
  let d = new Date(); d.setHours(0,0,0,0);
  const todayDay = peekDay(fmtKey(d));
  if(!predicate(todayDay, d)){ d = addDays(d,-1); } // don't break streak just because today isn't logged yet
  let guard = 0;
  while(guard++ < 1000){
    const key = fmtKey(d);
    const day = peekDay(key);
    if(predicate(day, d)){ count++; d = addDays(d,-1); continue; }
    if(opts.restDaySkip && d.getDay()===0){ d = addDays(d,-1); continue; }
    break;
  }
  return count;
}

const STREAK_DEFS = {
  corrida: { label:'Corrida', icon:'🏃', predicate:(day)=> !!(day && day.exercise && day.exercise.type==='corrida' && day.exercise.done), restDaySkip:true },
  caminhada: { label:'Caminhada', icon:'🚶', predicate:(day)=> !!(day && day.exercise && day.exercise.type==='caminhada' && day.exercise.done), restDaySkip:true },
  agua: { label:'Água', icon:'💧', predicate:(day)=> !!(day && day.water.ml >= data.settings.waterGoal), restDaySkip:false },
  espanhol: { label:'Espanhol', icon:'🇪🇸', predicate:(day)=> !!(day && day.spanish.minutes >= data.settings.spanishGoal), restDaySkip:false },
  registro: { label:'Registro diário', icon:'📝', predicate:(day)=> !!(day && day.checkin.done), restDaySkip:false },
};

function getAllStreaks(){
  const out = {};
  for(const key in STREAK_DEFS){
    out[key] = computeStreak(STREAK_DEFS[key].predicate, {restDaySkip:STREAK_DEFS[key].restDaySkip});
  }
  return out;
}

function monthlyConsistency(predicate, year, month, excludeSundays){
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const now = new Date(); now.setHours(0,0,0,0);
  let total=0, ok=0;
  for(let i=1;i<=daysInMonth;i++){
    const d = new Date(year,month,i);
    if(d>now) break;
    if(excludeSundays && d.getDay()===0) continue;
    total++;
    if(predicate(peekDay(fmtKey(d)), d)) ok++;
  }
  return total ? Math.round(ok/total*100) : 0;
}

/* ============================= 5) RECÁLCULO DIÁRIO ============================= */
function recalcDay(dayKey){
  const day = getDay(dayKey);
  const xv = data.settings.xpValues;

  // exercício
  if(day.exercise.done && day.exercise.type && day.exercise.type!=='descanso'){
    const amount = day.exercise.type==='corrida' ? xv.corrida : xv.caminhada;
    awardOnce(day, 'exercise', amount, (day.exercise.type==='corrida'?'🏃 Corrida':'🚶 Caminhada'), dayKey);
  }
  // água
  if(day.water.ml >= data.settings.waterGoal){
    awardOnce(day, 'water', xv.agua, '💧 Meta de água', dayKey);
  }
  // sono
  if(day.sleep.hours >= data.settings.sleepGoalMin){
    awardOnce(day, 'sleep', xv.sono, '😴 Sono adequado', dayKey);
  }
  // espanhol
  if(day.spanish.minutes >= data.settings.spanishGoal){
    awardOnce(day, 'spanish', xv.espanhol, '🇪🇸 Meta de espanhol', dayKey);
  }
  // quality time
  if(day.qualityTime.done){
    awardOnce(day, 'qualityTime', xv.vidaDois, '❤️ Tempo de qualidade', dayKey);
  }
  // check-in
  if(day.checkin.done){
    awardOnce(day, 'checkin', xv.registro, '📝 Check-in diário', dayKey);
  }
  checkAchievements();
  evaluateProgression();
}

/* --------- progressão de corrida / desbloqueio academia --------- */
function evaluateProgression(){
  const prog = data.progression;
  const now = new Date();
  const thisWeekStart = startOfWeek(now);
  const lastCompleteWeekStart = addDays(thisWeekStart,-7);
  const key = fmtKey(lastCompleteWeekStart);
  if(prog.lastEvaluatedWeek === key) return; // already evaluated this completed week

  let scheduledRuns=0, doneRuns=0, scheduledWalks=0, doneWalks=0;
  for(let i=0;i<7;i++){
    const d = addDays(lastCompleteWeekStart, i);
    const plan = WEEKLY_PLAN[d.getDay()];
    const day = peekDay(fmtKey(d));
    if(plan.type==='corrida'){
      scheduledRuns++;
      if(day && day.exercise.type==='corrida' && day.exercise.done && day.exercise.durationMin >= prog.runTargetMin) doneRuns++;
    }else if(plan.type==='caminhada'){
      scheduledWalks++;
      if(day && day.exercise.type==='caminhada' && day.exercise.done) doneWalks++;
    }
  }
  if(scheduledRuns===0) return; // week not fully in the past yet / no data model
  const weekOk = doneRuns>=scheduledRuns && doneWalks>=Math.ceil(scheduledWalks*0.5);
  prog.lastEvaluatedWeek = key;
  if(weekOk){
    prog.consistentWeeks++;
    if(prog.consistentWeeks>=3){
      progressRunPhase();
      prog.consistentWeeks = 0;
    }
    if(prog.consistentWeeks>=0 && !prog.academiaUnlocked && (prog.runPhase>=2)){
      prog.academiaUnlocked = true;
      toast('🏋️ FASE 2 DESBLOQUEADA! A academia agora está disponível — musculação é opcional, no seu ritmo.', 'ok');
      unlockAchievement('academia', '🏋️ Academia desbloqueada', 'Consistência liberou a próxima fase.');
    }
  }else{
    prog.consistentWeeks = 0;
  }
  save();
}

function progressRunPhase(){
  const prog = data.progression;
  if(prog.runTargetKm){
    const steps = [3,5,7,10,12,15,21];
    const idx = steps.indexOf(prog.runTargetKm);
    prog.runTargetKm = steps[Math.min(idx+1, steps.length-1)];
  }else if(prog.runTargetMin < 45){
    prog.runTargetMin = Math.min(45, prog.runTargetMin + 5);
  }else{
    prog.runTargetKm = 3; // começa a acompanhar distância
  }
  prog.runPhase++;
  toast('🎉 Progressão desbloqueada! Nova meta de corrida definida — ajuste se sentir necessidade.', 'ok');
}

/* --------- conquistas --------- */
const ACHIEVEMENT_DEFS = [
  {id:'level5', title:'⭐ Nível 5 alcançado', test:()=> levelFromXp(data.profile.xp).level>=5},

/* ---------- LIFE SCORE ---------- */
function periodConsistency(predicate, days, excludeSundays){
  let ok=0, total=0;
  for(let i=0;i<days;i++){
    const d = addDays(new Date(), -i);
    if(excludeSundays && d.getDay()===0) continue;
    total++;
    if(predicate(peekDay(fmtKey(d)), d)) ok++;
  }
  return total ? Math.round(ok/total*100) : 0;
}

function computeLifeScore(){
  const s = data.settings;
  const saudeSub = [
    periodConsistency(d=>!!(d && d.exercise.done && d.exercise.type!=='descanso'), 7, true),
    periodConsistency(d=>!!(d && d.water.ml>=s.waterGoal), 7, false),
    periodConsistency(d=>!!(d && d.sleep.hours>=s.sleepGoalMin), 7, false),
    periodConsistency(d=>!!(d && d.steps.actual>=d.steps.goal), 7, false),
  ];
  const saude = Math.round(saudeSub.reduce((a,b)=>a+b,0)/saudeSub.length);

  const financas = pct(data.finance.current, s.financeGoal);

  const missionsDone = data.career.missions.filter(m=>m.status==='concluido').length;
  const carreira = data.career.missions.length ? Math.round(missionsDone/data.career.missions.length*100) : 0;

  const espanholW = periodConsistency(d=>!!(d && d.spanish.minutes>=s.spanishGoal), 7, false);
  const iaCount7 = data.aiLog.filter(l=> new Date(l.date) >= addDays(new Date(),-7)).length;
  const iaW = Math.min(100, iaCount7*20);
  const desenvolvimento = Math.round((espanholW+iaW)/2);

  const relacionamentos = periodConsistency(d=>!!(d && d.qualityTime.done), 30, false);

  const questsPct = data.quests.length ? Math.round(data.quests.filter(q=>q.status==='done').length/data.quests.length*100) : 0;
  const visitedCountries = new Set(data.trips.filter(t=>t.status==='visited'||t.status==='lived').map(t=>t.country)).size;
  const tripsPct = Math.min(100, visitedCountries*20);
  const experiencias = data.trips.length ? Math.round((questsPct+tripsPct)/2) : questsPct;

  const parts = {saude, financas, carreira, desenvolvimento, relacionamentos, experiencias};
  const w = s.lifeScoreWeights || {};
  let sumW=0, sumWV=0;
  Object.keys(parts).forEach(k=>{ const wt = w[k]??1; sumW+=wt; sumWV+=wt*parts[k]; });
  const overall = sumW ? Math.round(sumWV/sumW) : 0;
  return Object.assign({overall}, parts);
}

const LIFE_SCORE_LABELS = {saude:'🏋️ Saúde', financas:'💰 Finanças', carreira:'💼 Carreira', desenvolvimento:'📚 Desenvolvimento', relacionamentos:'❤️ Relações', experiencias:'🌎 Experiências'};

function lifeScoreCard(){
  const score = computeLifeScore();
  return `<div class="card hoverable" data-action="nav" data-view="progresso" style="cursor:pointer;">

    </div>

function findNextEvent(){
  const now = new Date(); now.setHours(0,0,0,0);
  const candidates = [];
  data.trips.forEach(t=>{
    if(t.status==='planned' && t.startDate){
      const d = parseKey(t.startDate);
      if(d>=now) candidates.push({label:(t.flag?t.flag+' ':'🌎 ')+t.title, date:d});
    }
  });
  data.career.missions.forEach(m=>{
    if(m.status!=='concluido' && m.deadline){
      const d = parseKey(m.deadline);
      if(d>=now) candidates.push({label:(m.icon||'💼')+' '+m.title, date:d});
    }
  });
  if(!candidates.length) return null;
  candidates.sort((a,b)=>a.date-b.date);
  const next = candidates[0];
  const days = Math.round((next.date-now)/86400000);
  return {label:next.label, days};
}
function getRecentMemory(){
  if(!data.relationship.memories.length) return null;
  return data.relationship.memories.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
}

function weeklyAverage(getter){
  let sum=0,n=0;
  for(let i=0;i<7;i++){ const day = peekDay(fmtKey(addDays(new Date(),-i))); if(day){ const v = getter(day); if(v!==null && v!==undefined){ sum+=v; n++; } } }
  return n? sum/n : null;
}

function coachMsgHtml(m){
  if(m.role==='system') return `<div class="coach-msg system">${esc(m.content)}</div>`;
  return `<div class="coach-msg ${m.role==='user'?'user':'assistant'}">${esc(m.content)}</div>`;
}
function coachAppend(role, content){
  data.coach.messages.push({role, content, time:new Date().toISOString()});
  if(data.coach.messages.length>40) data.coach.messages = data.coach.messages.slice(-40);
  save();
}
async function sendCoachMessage(text){
  text = text.trim();
  if(!text) return;
  const s = data.settings;
  if(!s.coachApiUrl){
    coachAppend('system', '⚠️ Configure a URL do backend do coach em Configurações antes de conversar.');
    renderCoach();
    return;
  }
  coachAppend('user', text);
  renderCoach();
  const msgsEl = document.getElementById('coachMsgs');
  if(msgsEl){
    const typing = document.createElement('div');
    typing.className = 'coach-msg assistant'; typing.id = 'coachTyping';
    typing.innerHTML = '<div class="coach-typing"><span></span><span></span><span></span></div>';
    msgsEl.appendChild(typing); msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  try{
    const history = data.coach.messages.slice(-10).map(m=>({role:m.role, content:m.content}));
    const res = await fetch(s.coachApiUrl.replace(/\/$/,'') + '/api/coach', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:text, history, context: buildCoachContext() }),
    });
    const data_ = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data_.error || ('HTTP ' + res.status));
    coachAppend('assistant', data_.reply || 'Sem resposta do coach.');
  }catch(err){
    coachAppend('system', '❌ Não consegui falar com o backend do coach (' + err.message + '). Verifique a URL em Configurações e se o serviço está no ar.');
  }
  renderCoach();
}

          <b style="color:${['aporte','investimento','reserva','renda'].includes(h.type)?'var(--success)':'var(--danger)'}">${['aporte','investimento','reserva','renda'].includes(h.type)?'+':'-'}€${fmt2(h.amount)}</b>

function financeIcon(t){ return {aporte:'💰',investimento:'📈',reserva:'🏦',renda:'💵',despesa:'🧾'}[t]||'💰'; }
function computeProjection(){
  const hist = data.finance.history.filter(h=>['aporte','investimento','reserva'].includes(h.type));
  if(hist.length<2) return 'Registre alguns aportes para ver a projeção de quando você atinge a meta.';
  const byMonth = {};
  hist.forEach(h=>{ const mk = h.date.slice(0,7); byMonth[mk] = (byMonth[mk]||0)+h.amount; });
  const months = Object.keys(byMonth).sort();
  const avg = Object.values(byMonth).reduce((a,b)=>a+b,0)/months.length;
  if(avg<=0) return 'Adicione aportes recorrentes para estimarmos sua projeção.';
  const remaining = data.settings.financeGoal - data.finance.current;
  if(remaining<=0) return '🎉 Meta financeira alcançada!';
  const monthsLeft = Math.ceil(remaining/avg);
  const target = new Date(); target.setMonth(target.getMonth()+monthsLeft);
  return `📈 No ritmo atual (~€${fmt2(avg)}/mês), você atinge a meta em ~${monthsLeft} meses (${target.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}).`;
}

function renderMesTab(){

/* ---------- GRÁFICOS ---------- */
let chartRegistry = {};
function mkChart(canvasId, type, labels, datasets, opts){
  const el = document.getElementById(canvasId);
  if(!el) return;
  if(typeof Chart === 'undefined'){
    el.parentElement.innerHTML = '<div class="empty-state">📉 Não foi possível carregar a biblioteca de gráficos (sem conexão com a internet). Os dados continuam salvos normalmente.</div>';
    return;
  }
  if(chartRegistry[canvasId]) chartRegistry[canvasId].destroy();
  const isLight = document.body.getAttribute('data-theme')==='light';
  const gridColor = isLight? 'rgba(0,0,0,.06)':'rgba(255,255,255,.06)';
  const textColor = isLight? '#5c6a80':'#8b9ab0';
  chartRegistry[canvasId] = new Chart(el.getContext('2d'), {
    type, data:{labels, datasets},
    options: Object.assign({
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:textColor}}},
      scales:{ x:{ticks:{color:textColor}, grid:{color:gridColor}}, y:{ticks:{color:textColor}, grid:{color:gridColor}} }
    }, opts||{})
  });
}
function lastNDaysLabels(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=addDays(new Date(),-i); out.push(pad(d.getDate())+'/'+pad(d.getMonth()+1)); } return out; }
function lastNDaysValues(n, getter){ const out=[]; for(let i=n-1;i>=0;i--){ const d=addDays(new Date(),-i); const day=peekDay(fmtKey(d)); out.push(getter(day)||0); } return out; }

function renderGraficosTab(){
  document.getElementById('progressoBody').innerHTML = `
    <div class="grid-2">
      <div class="card"><div class="card-title">🏃 Minutos de corrida (14 dias)</div><div class="chart-box"><canvas id="chartCorrida"></canvas></div></div>
      <div class="card"><div class="card-title">👣 Passos (14 dias)</div><div class="chart-box"><canvas id="chartPassos"></canvas></div></div>

    </div>
  `;
  const labels14 = lastNDaysLabels(14);
  mkChart('chartCorrida','bar',labels14,[{label:'min', data:lastNDaysValues(14,d=>d&&d.exercise.type==='corrida'?d.exercise.durationMin:0), backgroundColor:'#2dd4bf'}]);
  mkChart('chartPassos','bar',labels14,[{label:'passos', data:lastNDaysValues(14,d=>d?d.steps.actual:0), backgroundColor:'#2dd4bf'}]);
  mkChart('chartAgua','bar',labels14,[{label:'ml', data:lastNDaysValues(14,d=>d?d.water.ml:0), backgroundColor:'#2dd4bf'}]);

  mkChart('chartEspanhol','bar',labels14,[{label:'min', data:lastNDaysValues(14,d=>d?d.spanish.minutes:0), backgroundColor:'#2dd4bf'}]);
  const iaCounts = lastNDaysLabels(14).map((_,idx)=>{ const d=addDays(new Date(),-(13-idx)); const key=fmtKey(d); return data.aiLog.filter(l=>l.date.slice(0,10)===key).length; });
  mkChart('chartIA','bar',labels14,[{label:'registros', data:iaCounts, backgroundColor:'#2dd4bf'}]);

  const histSorted = data.finance.history.slice().sort((a,b)=>a.date.localeCompare(b.date));

  mkChart('chartPatrimonio','line', finLabels.length?finLabels:['início'], [{label:'€', data:finData.length?finData:[data.finance.current], borderColor:'#2dd4bf', backgroundColor:'rgba(45,212,191,.15)', fill:true, tension:.3}]);

  const xpLabels = lastNDaysLabels(30);

  let base = xpNow - xpByDay.reduce((a,b)=>a+b,0);

  mkChart('chartXP','line', xpLabels, [{label:'XP', data:xpCumData, borderColor:'#2dd4bf', backgroundColor:'rgba(45,212,191,.15)', fill:true, tension:.3}]);

  mkChart('chartHumor','line', labels14, [{label:'humor (1-5)', data:lastNDaysValues(14,d=>d?d.mood.score:0), borderColor:'#f0b34d', backgroundColor:'rgba(240,179,77,.15)', fill:true, tension:.3}], {scales:{y:{min:0,max:5, ticks:{color:'#8b95a7'}, grid:{color:'rgba(255,255,255,.06)'}}, x:{ticks:{color:'#8b95a7'}}}});
}

/* ============================= 8) MODAL / TOAST ============================= */
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }

function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast';
  if(kind==='ok') el.style.borderColor = 'var(--success)';
  if(kind==='warn') el.style.borderColor = 'var(--warning)';
  if(kind==='danger') el.style.borderColor = 'var(--danger)';
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 4200);
}

/* ============================= 9) DISPATCH ============================= */
document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t){
    if(e.target.id==='overlayBg') closeSidebarMobile();
    if(e.target.id==='modalOverlay') closeModal();
    return;
  }
  const action = t.dataset.action;
  const key = todayKey();
  const day = getDay(key);

  switch(action){
    case 'nav': setView(t.dataset.view); return;
    case 'open-mobile-menu': openSidebarMobile(); return;
    case 'goto-saude': setView('saude'); return;
    case 'goto-aprendizado': setView('aprendizado'); return;
    case 'coach-quick': {
      const inp = document.getElementById('coachInput');
      if(inp){ inp.value = t.dataset.value; inp.focus(); }
      return;
    }
    case 'coach-send': {
      const inp = document.getElementById('coachInput');
      const text = inp ? inp.value : '';
      if(inp) inp.value = '';
      sendCoachMessage(text);
      return;
    }
    case 'close-modal': closeModal(); return;

    case 'quick-exercise':
      day.exercise.done = !day.exercise.done;
      if(day.exercise.done && !day.exercise.type){ day.exercise.type = WEEKLY_PLAN[new Date().getDay()].type; day.exercise.durationMin = data.progression.runTargetMin; }
      recalcDay(key); save(); renderCurrentView(); return;
    case 'quick-water':
      day.water.ml += 250; recalcDay(key); save(); renderCurrentView(); return;
    case 'quick-love':
      day.qualityTime.done = !day.qualityTime.done; recalcDay(key); save(); renderCurrentView(); return;
    case 'finish-checkin':
      day.checkin.done = true; recalcDay(key); save(); renderCurrentView(); return;

    case 'set-mood':
      day.mood.score = Number(t.dataset.value); save(); renderCurrentView(); return;
    case 'save-mood-note':
      day.mood.note = document.getElementById('moodNote').value; save(); toast('😊 Observação salva.'); return;
    case 'save-journal':
      day.journal = document.getElementById('journalText').value; save(); renderCurrentView(); toast('🧠 Reflexão salva.', 'ok'); return;

    case 'save-exercise': {
      const type = document.getElementById('exType').value;
      const dur = Number(document.getElementById('exDuration').value)||0;
      const dist = Number(document.getElementById('exDistance').value)||0;
      day.exercise.type = type; day.exercise.durationMin = dur; day.exercise.distanceKm = dist; day.exercise.done = dur>0;
      recalcDay(key); save(); renderCurrentView();
      toast('✅ Exercício registrado.', 'ok'); return;
    }
    case 'save-steps': {
      const v = Number(document.getElementById('stepsActual').value)||0;
      day.steps.actual = v; save(); renderCurrentView(); return;
    }
    case 'add-water':
      day.water.ml += Number(t.dataset.value); recalcDay(key); save(); renderCurrentView(); return;
    case 'reset-water':
      day.water.ml = 0; save(); renderCurrentView(); return;

    case 'add-meal-item': {
      const mk = t.dataset.meal;
      const food = document.getElementById('food_'+mk).value.trim();
      const qty = document.getElementById('qty_'+mk).value.trim();
      const time = document.getElementById('time_'+mk).value;
      if(!food){ toast('Digite o alimento.', 'warn'); return; }
      day.meals[mk].push({food, qty, time});
      save(); renderCurrentView(); return;
    }
    case 'remove-meal-item': {
      const mk = t.dataset.meal; const idx = Number(t.dataset.idx);
      day.meals[mk].splice(idx,1); save(); renderCurrentView(); return;
    }
    case 'set-meal-rating': day.mealRating = t.dataset.value; save(); renderCurrentView(); return;

    case 'set-sleep-quality': day.sleep.quality = Number(t.dataset.value); save(); renderCurrentView(); return;
    case 'save-sleep': {
      const st = document.getElementById('sleepTime').value;
      const wt = document.getElementById('wakeTime').value;
      day.sleep.sleepTime = st; day.sleep.wakeTime = wt;
      if(st && wt){
        let [sh,sm] = st.split(':').map(Number); let [wh,wm] = wt.split(':').map(Number);
        let mins = (wh*60+wm) - (sh*60+sm); if(mins<0) mins += 24*60;
        day.sleep.hours = Math.round((mins/60)*10)/10;
      }
      recalcDay(key); save(); renderCurrentView(); toast('😴 Sono salvo.', 'ok'); return;
    }

    case 'add-spanish': day.spanish.minutes += Number(t.dataset.value); recalcDay(key); save(); renderCurrentView(); return;
    case 'add-spanish-manual': {
      const v = Number(document.getElementById('spanishManual').value)||0;
      day.spanish.minutes += v; recalcDay(key); save(); renderCurrentView(); return;
    }
    case 'toggle-spanish-skill': {
      const sk = t.dataset.value; const arr = day.spanish.skills;
      const i = arr.indexOf(sk); if(i>=0) arr.splice(i,1); else arr.push(sk);
      save(); renderCurrentView(); return;
    }
    case 'save-spanish-note': day.spanish.note = document.getElementById('spanishNote').value; save(); toast('🇪🇸 Nota salva.'); return;

    case 'add-ai-log': {
      const type = document.getElementById('aiType').value;
      const tool = document.getElementById('aiTool').value.trim();
      const desc = document.getElementById('aiDesc').value.trim();
      if(!tool && !desc){ toast('Adicione ao menos uma descrição.', 'warn'); return; }
      const xpMap = {aprendi:data.settings.xpValues.aprendizado, pratiquei:data.settings.xpValues.pratica, criei:data.settings.xpValues.projeto};
      const xp = xpMap[type];
      data.aiLog.push({id:uid(), date:new Date().toISOString(), type, tool, desc, xp});
      addXP(xp, (type==='criei'?'🚀 Projeto criado':(type==='pratiquei'?'🧪 Prática':'📚 Aprendizado')), key);
      checkAchievements(); save(); renderCurrentView(); toast('🤖 Registrado! +'+xp+' xp', 'ok'); return;
    }
    case 'remove-ai-log': data.aiLog = data.aiLog.filter(l=>l.id!==t.dataset.id); save(); renderCurrentView(); return;

    case 'change-objective': return; // handled on change event below
    case 'career-stat': {
      const k = t.dataset.key; const delta = Number(t.dataset.delta);
      data.career.stats[k] = Math.max(0, (data.career.stats[k]||0)+delta); save(); renderCurrentView(); return;
    }
    case 'open-mission-modal': openMissionModal(); return;
    case 'save-mission': {
      const title = document.getElementById('mTitle').value.trim();
      if(!title){ toast('Digite um título.', 'warn'); return; }
      data.career.missions.push({
        id:uid(), title, icon:document.getElementById('mIcon').value||'📌', category:'geral',
        status:'nao_iniciado', priority:document.getElementById('mPriority').value,
        deadline:document.getElementById('mDeadline').value, note:document.getElementById('mNote').value,
        xpAwarded:false, createdAt:new Date().toISOString(),
      });
      save(); closeModal(); renderCurrentView(); return;
    }
    case 'cycle-mission-status': {
      const m = data.career.missions.find(x=>x.id===t.dataset.id);
      const order = ['nao_iniciado','em_andamento','concluido'];
      m.status = order[(order.indexOf(m.status)+1)%order.length];
      if(m.status==='concluido' && !m.xpAwarded){ m.xpAwarded = true; addXP(data.settings.xpValues.missao, '💼 Missão concluída', key); toast('💼 Missão concluída! +'+data.settings.xpValues.missao+' xp', 'ok'); }
      checkAchievements(); save(); renderCurrentView(); return;
    }
    case 'delete-mission': data.career.missions = data.career.missions.filter(m=>m.id!==t.dataset.id); save(); renderCurrentView(); return;

    case 'open-quest-modal': openQuestModal(); return;
    case 'save-quest': {
      const title = document.getElementById('qTitle').value.trim();
      if(!title){ toast('Digite um título.', 'warn'); return; }
      data.quests.push({id:uid(), title, status:'pending', category:document.getElementById('qCategory').value||'geral', note:'', dateCompleted:null});
      save(); closeModal(); renderCurrentView(); return;
    }
    case 'complete-quest': {
      const q = data.quests.find(x=>x.id===t.dataset.id);
      q.status = 'done'; q.dateCompleted = new Date().toISOString();
      addXP(data.settings.xpValues.experiencia, '🌎 Quest concluída', key);
      checkAchievements(); save(); renderCurrentView();
      toast('🏆 QUEST COMPLETED! +'+data.settings.xpValues.experiencia+' xp', 'ok'); return;
    }
    case 'delete-quest': data.quests = data.quests.filter(q=>q.id!==t.dataset.id); save(); renderCurrentView(); return;

    case 'open-finance-modal': openFinanceModal(); return;
    case 'save-finance': {
      const type = document.getElementById('fType').value;
      const amount = Number(document.getElementById('fAmount').value)||0;
      if(amount<=0){ toast('Informe um valor válido.', 'warn'); return; }
      const dateV = document.getElementById('fDate').value || key;
      const note = document.getElementById('fNote').value;
      data.finance.history.push({id:uid(), date:dateV, amount, type, note});
      if(['aporte','investimento','reserva','renda'].includes(type)){
        data.finance.current += amount;
        const xp = Math.round(amount/100*data.settings.xpValues.aportePer100);
        addXP(xp, '💰 Aporte financeiro', key);
      }else{
        data.finance.current = Math.max(0, data.finance.current - amount);
      }
      checkAchievements(); save(); closeModal(); renderCurrentView(); return;
    }

    case 'open-memory-modal': openMemoryModal(); return;
    case 'save-memory': {
      const title = document.getElementById('memTitle').value.trim();
      const location = document.getElementById('memLocation').value.trim();
      const dateV = document.getElementById('memDate').value || key;
      if(!title || !location){ toast('Preencha título e local.', 'warn'); return; }
      const files = document.getElementById('memPhotos').files;
      const mem = {id:uid(), date:dateV, location, title, description:document.getElementById('memDesc').value, category:document.getElementById('memCategory').value||'geral', photos:[]};
      const finishSave = ()=>{
        data.relationship.memories.push(mem);
        day.qualityTime.done = true; recalcDay(key);
        checkAchievements(); save(); closeModal(); renderCurrentView();
        toast('❤️ Memória adicionada!', 'ok');
      };
      if(files && files.length){
        let pending = files.length;
        Array.from(files).forEach(file=>{
          resizeImage(file, 800, .72, (dataUrl)=>{ mem.photos.push(dataUrl); pending--; if(pending===0) finishSave(); });
        });
      }else{ finishSave(); }
      return;
    }
    case 'delete-memory': data.relationship.memories = data.relationship.memories.filter(m=>m.id!==t.dataset.id); save(); renderCurrentView(); return;

    case 'open-trip-modal': openTripModal(); return;
    case 'save-trip': {
      const title = document.getElementById('tripTitle').value.trim();
      if(!title){ toast('Digite um título.', 'warn'); return; }
      const trip = {
        id:uid(), title, flag:document.getElementById('tripFlag').value||'🌎', country:document.getElementById('tripCountry').value.trim(),
        status:document.getElementById('tripStatus').value, startDate:document.getElementById('tripStart').value, endDate:document.getElementById('tripEnd').value,
        cover:null, photos:[], places:[], notes:'',
      };
      const files = document.getElementById('tripCover').files;
      const finishSave = ()=>{ data.trips.push(trip); checkAchievements(); save(); closeModal(); renderCurrentView(); toast('🌎 Viagem adicionada!', 'ok'); };
      if(files && files.length){ resizeImage(files[0], 900, .75, (dataUrl)=>{ trip.cover = dataUrl; finishSave(); }); }
      else finishSave();
      return;
    }
    case 'open-trip-detail': openTripDetailModal(t.dataset.id); return;
    case 'add-trip-place': {
      const trip = data.trips.find(x=>x.id===t.dataset.id);
      const input = document.getElementById('tripPlaceInput');
      const val = input.value.trim(); if(!val) return;
      trip.places.push({name:val}); save(); openTripDetailModal(trip.id); return;
    }
    case 'remove-trip-place': {
      const trip = data.trips.find(x=>x.id===t.dataset.id);
      trip.places.splice(Number(t.dataset.idx),1); save(); openTripDetailModal(trip.id); return;
    }
    case 'save-trip-notes': {
      const trip = data.trips.find(x=>x.id===t.dataset.id);
      trip.notes = document.getElementById('tripNotes').value;
      const photoInput = document.getElementById('tripPhotoInput');
      const files = photoInput ? photoInput.files : null;
      const finish = ()=>{ save(); closeModal(); renderCurrentView(); toast('🌎 Viagem atualizada.', 'ok'); };
      if(files && files.length){
        let pending = files.length;
        Array.from(files).forEach(file=>{ resizeImage(file, 800, .72, (dataUrl)=>{ trip.photos.push(dataUrl); pending--; if(pending===0) finish(); }); });
      }else finish();
      return;
    }
    case 'delete-trip': data.trips = data.trips.filter(x=>x.id!==t.dataset.id); save(); closeModal(); renderCurrentView(); return;

    case 'filter-memories': {
      const f = t.dataset.filter; state.memFilters[f] = t.value; renderCurrentView(); return;
    }

    case 'progresso-tab': state.progressoTab = t.dataset.tab; renderCurrentView(); return;
    case 'week-nav': state.weekOffset += Number(t.dataset.delta); renderCurrentView(); return;
    case 'month-nav': {
      state.calMonth += Number(t.dataset.delta);
      if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
      if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
      renderCurrentView(); return;
    }
    case 'open-day-detail': openDayDetailModal(t.dataset.key); return;

    case 'toggle-future': {
      const item = data.futureMe[t.dataset.block].find(x=>x.id===t.dataset.id);
      item.done = !item.done; save(); renderCurrentView(); return;
    }
    case 'delete-future': {
      data.futureMe[t.dataset.block] = data.futureMe[t.dataset.block].filter(x=>x.id!==t.dataset.id); save(); renderCurrentView(); return;
    }
    case 'add-future': {
      const blk = t.dataset.block; const input = document.getElementById('future_'+blk);
      const val = input.value.trim(); if(!val) return;
      data.futureMe[blk].push({id:uid(), text:val, done:false}); save(); renderCurrentView(); return;
    }

    case 'save-config': {
      data.profile.name = document.getElementById('cfgName').value || 'Léo';
      data.profile.theme = document.getElementById('cfgTheme').value;
      data.settings.waterGoal = Number(document.getElementById('cfgWater').value)||2000;
      data.settings.stepsBase = Number(document.getElementById('cfgSteps').value)||8000;
      data.settings.spanishGoal = Number(document.getElementById('cfgSpanish').value)||45;
      data.settings.financeGoal = Number(document.getElementById('cfgFinance').value)||30000;
      data.settings.sleepGoalMin = Number(document.getElementById('cfgSleepMin').value)||7;
      data.settings.sleepGoalMax = Number(document.getElementById('cfgSleepMax').value)||8;
      applyTheme(); save(); renderAll(); toast('⚙️ Configurações salvas.', 'ok'); return;
    }
    case 'save-coach-url': {
      data.settings.coachApiUrl = document.getElementById('cfgCoachUrl').value.trim();
      save(); toast('🧭 URL do coach salva.', 'ok'); return;
    }
    case 'save-xp': {
      Object.keys(data.settings.xpValues).forEach(k=>{
        const el = document.getElementById('xp_'+k); if(el) data.settings.xpValues[k] = Number(el.value)||0;
      });
      save(); toast('⭐ Valores de XP atualizados.', 'ok'); return;
    }
    case 'save-reminders': {
      Object.keys(data.settings.reminders).forEach(k=>{
        data.settings.reminders[k].time = document.getElementById('rtime_'+k).value;
        data.settings.reminders[k].enabled = document.getElementById('renabled_'+k).checked;
      });
      save(); toast('🔔 Lembretes atualizados.', 'ok'); return;
    }
    case 'request-notification-permission': {
      if(!('Notification' in window)){ toast('Notificações não suportadas neste navegador.', 'warn'); return; }
      Notification.requestPermission().then(p=>{
        toast(p==='granted' ? '🔔 Notificações ativadas!' : '🔕 Permissão não concedida.', p==='granted'?'ok':'warn');
      });
      return;
    }
    case 'export-data': exportData(); return;
    case 'reset-data': {
      if(confirm('Isso vai apagar TODOS os dados salvos localmente. Você exportou um backup? Deseja continuar?')){
        localStorage.removeItem(STORAGE_KEY); load(); renderAll(); toast('🗑️ Dados resetados.', 'warn');
      }
      return;
    }
  }
});

document.addEventListener('change', (e)=>{
  if(e.target.id==='careerObjective'){ data.career.objective = e.target.value; save(); renderCurrentView(); }
});

document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  const sb = document.getElementById('sidebar');
  sb.classList.contains('open') ? closeSidebarMobile() : openSidebarMobile();
});

document.getElementById('sidebarCollapseBtn').addEventListener('click', toggleSidebar);

document.addEventListener('keydown', (e)=>{
  if(e.target && e.target.id==='coachInput' && e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    const text = e.target.value; e.target.value='';

  }
});

/* ============================= util: imagem ============================= */
function resizeImage(file, maxSize, quality, cb){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      let {width,height} = img;
      if(width>height && width>maxSize){ height = Math.round(height*maxSize/width); width = maxSize; }
      else if(height>maxSize){ width = Math.round(width*maxSize/height); height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============================= 10) TEMA ============================= */
function applyTheme(){
  document.body.setAttribute('data-theme', data.profile.theme || 'dark');
}

/* ============================= 11) LEMBRETES ============================= */
function checkReminders(){
  const now = new Date();
  const hhmm = pad(now.getHours())+':'+pad(now.getMinutes());
  const todayK = todayKey();
  Object.keys(data.settings.reminders).forEach(k=>{
    const r = data.settings.reminders[k];
    if(!r.enabled) return;
    if(r.time===hhmm && r.lastFired!==todayK){
      r.lastFired = todayK;
      fireReminder(r.label);
      save();
    }
  });
}
function fireReminder(msg){
  if('Notification' in window && Notification.permission==='granted'){
    // Nota: notificações via Notification API só funcionam enquanto esta aba
    // estiver aberta (não há Service Worker/push em background nesta versão
    // single-file, pois isso exigiria um servidor HTTPS + arquivos extras).
    new Notification('LIFE OS', {body: msg});
  }else{
    toast(msg);
  }
}

/* ============================= 12) INIT ============================= */
function init(){
  load();
  applyTheme();
  renderSidebar();
  recalcDay(todayKey());
  save();
  setView('dashboard');
  setInterval(checkReminders, 30000);
}
document.addEventListener('DOMContentLoaded', init);
</script>
