<!doctype html>
<html lang="pt-BR">
<head>

  <link rel="stylesheet" href="style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "De Mala y Cuia",
    "url": "https://demalaycuia.netlify.app/",
    "description": "Do Brasil para a Espanha: experiências, descobertas e ferramentas para quem quer morar ou viajar pela Espanha."
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#conteudos">Pular para os conteúdos</a>

  <!-- Biblioteca de ícones (SVG sprite) — adicionar novos <symbol> aqui -->

      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" transform="translate(0 -2)"/><path d="M9 8h7M9 11.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-calculator" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8" y="5.5" width="8" height="3.5" rx=".8" fill="none" stroke="currentColor" stroke-width="1.6"/><g fill="currentColor"><circle cx="9" cy="12.8" r="1.1"/><circle cx="12" cy="12.8" r="1.1"/><circle cx="15" cy="12.8" r="1.1"/><circle cx="9" cy="16.6" r="1.1"/><circle cx="12" cy="16.6" r="1.1"/><circle cx="15" cy="16.6" r="1.1"/></g></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m10 8.5 5.5 3.5-5.5 3.5v-7Z" fill="currentColor"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9h17M3.5 14.5h17M9.5 9v11.5" stroke="currentColor" stroke-width="1.8"/></symbol>

  </svg>

  <div class="page">
    <!-- ================= CABEÇALHO ================= -->
    <header class="hero">
      <svg class="hero__route" viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true">
        <path d="M-10 190 C 90 60, 260 250, 410 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round"/>
      </svg>

      <div class="hero__mark" aria-hidden="true">
        <!-- Marca da cuia: verde erva-mate (cuia) + dourado (bomba) -->
        <svg viewBox="0 0 64 64" width="64" height="64">
          <path d="M40.5 4.5 35 26" stroke="#C9A227" stroke-width="3.2" stroke-linecap="round"/>
          <rect x="37.4" y="2.2" width="7.4" height="3.6" rx="1.4" fill="#C9A227" transform="rotate(14 41 4)"/>
          <ellipse cx="32" cy="24" rx="15" ry="4" fill="#86A95E"/>
          <path d="M15.5 24c-1.5 6 -1 13 3 19.5C22 49 26.5 52 32 52s10-3 13.5-8.5c4-6.5 4.5-13.5 3-19.5-3 2.6-9.6 4-16.5 4s-13.5-1.4-16.5-4Z" fill="#1F3D2B" stroke="#3E7350" stroke-width="1.6"/>
          <path d="M23 58h18" stroke="#1F3D2B" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M27 52.5v5M37 52.5v5" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 class="brand" id="brand">
        <!-- Substituído automaticamente por <img> se site.logo estiver preenchido -->
        <span class="brand__text">De Mala <span class="brand__y">y</span> Cuia</span>
      </h1>

      <p class="route" aria-label="Do Brasil para a Espanha">
        <span class="route__place">
          <svg class="flag" viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="3" fill="#229E45"/><path d="M14 3 25 10 14 17 3 10Z" fill="#F8E509"/><circle cx="14" cy="10" r="4" fill="#2B49A3"/></svg>
          Brasil
        </span>
        <span class="route__line" aria-hidden="true">
          <svg class="route__plane"><use href="#i-plane"/></svg>
        </span>
        <span class="route__place">
          Espanha
          <svg class="flag" viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="3" fill="#C60B1E"/><rect y="5" width="28" height="10" fill="#FFC400"/></svg>
        </span>
      </p>

      <p class="hero__tagline" id="tagline"></p>

      <nav class="hero__social" id="hero-social" aria-label="Redes sociais"></nav>
    </header>

    <!-- ================= RECURSOS ================= -->
    <main id="conteudos" class="resources" tabindex="-1">
      <!-- Renderizado por script.js a partir de config.js -->
      <noscript>
        <p class="noscript">Ative o JavaScript para ver nossos conteúdos.</p>
      </noscript>
    </main>

    <!-- ================= REDES / RODAPÉ ================= -->
    <footer class="footer">
      <h2 class="eyebrow">Siga a jornada</h2>
      <ul class="social-list" id="footer-social"></ul>
      <p class="footer__note">
        <span class="stamp" aria-hidden="true">BR → ES</span>
        © <span id="year"></span> De Mala <span class="brand__y">y</span> Cuia
      </p>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
